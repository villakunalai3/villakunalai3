 จาก SCB Business Anywhere)`);\n  return it.next();\n}\nfunction readLatestCSV() {   // อ่านไฟล์ CSV ที่แก้ไขล่าสุดในโฟลเดอร์ แล้วเพิ่มลง BankLines\n  const folder = findBankFolder(); let best = null; const it = folder.getFiles();\n  while (it.hasNext()) { const f = it.next(); if (!/\\.(csv|txt)$/i.test(f.getName())) continue; if (!best || f.getLastUpdated() > best.getLastUpdated()) best = f; }\n  if (!best) throw new Error('ไม่พบไฟล์ CSV ในโฟลเดอร์สเตตเมนต์');\n  const key = best.getId() + '|' + new Date(best.getLastUpdated()).getTime(), P = PropertiesService.getScriptProperties();\n  if (P.getProperty('BANK_LAST_FILE') === key) return { file: best.getName(), unchanged: true };\n  const blob = best.getBlob(); let text = blob.getDataAsString('UTF-8');\n  if (text.indexOf('�') >= 0) for (const cs of ['windows-874', 'TIS-620']) { try { const t2 = blob.getDataAsString(cs); if (t2.indexOf('�') < 0) { text = t2; break; } } catch (e) { } }\n  const list = parseBankCsv(text), r = importBankRows(list);\n  if (!list.length) throw new Error(`อ่านรายการเงินเข้าจากไฟล์ \"${best.getName()}\" ไม่ได้ (ตรวจหัวตาราง/รูปแบบไฟล์)`);\n  P.setProperty('BANK_LAST_FILE', key);\n  return { file: best.getName(), read: list.length, added: r.added, skipped: r.skipped };\n}\nconst normRef = x => String(x || '').toUpperCase().replace(/[^A-Z0-9]/g, '');\nfunction matchPayments() {   // สลิปที่รอตรวจ ↔ รายการเงินเข้า: ยอด + วันที่โอน ±1 วัน (+Reference ถ้าตรง) · 1 รายการเดินบัญชีใช้ได้กับ 1 สลิป (มาก่อนได้ก่อน)\n  const all = rows('Payments'), live = new Set(all.filter(p => ['pending', 'verified'].includes(p.status)).map(p => p.pay_id));\n  const lines = rows('BankLines');\n  lines.forEach(l => { if (l.matched_pay && !live.has(l.matched_pay)) { patch('BankLines', l, { matched_pay: '' }); l.matched_pay = ''; } });\n  const res = { found: 0, not_found: 0, diff: 0 };\n  all.filter(p => p.status === 'pending').sort((a, b) => a.submitted_at < b.submitted_at ? -1 : 1).forEach(p => {\n    const d = p.paid_on || String(p.submitted_at).slice(0, 10), a = addDays(d, -1), b = addDays(d, 1), amt = num(p.amount), ref = normRef(p.ref_no);\n    const cand = lines.filter(l => (!l.matched_pay || l.matched_pay === p.pay_id) && l.date >= a && l.date <= b);\n    let hit = cand.filter(l => Math.abs(num(l.amount) - amt) < 0.005);\n    const iref = p.intent_id ? intentRef(p.intent_id) : '';   // เลขใบแจ้ง (Ref ของ Bill Payment) ช่วยแยกยอดเท่ากัน\n    if (hit.length > 1 && iref) { const byI = hit.filter(l => normRef((l.ref || '') + (l.name || '')).includes(iref)); if (byI.length) hit = byI; }\n    if (hit.length > 1 && ref) { const byRef = hit.filter(l => { const r = normRef(l.ref); return r && (r === ref || r.includes(ref) || ref.includes(r)); }); if (byRef.length) hit = byRef; }\n    hit.sort((x, y) => (y.matched_pay === p.pay_id) - (x.matched_pay === p.pay_id) || Math.abs(dayDiff(x.date, d)) - Math.abs(dayDiff(y.date, d)));\n    let st, note = '';\n    if (hit.length) {\n      const l = hit[0]; st = 'found'; note = (l.date + ' ' + (l.time || '')).trim() + (l.name ? ' • ' + l.name : '');\n      if (l.matched_pay !== p.pay_id) { patch('BankLines', l, { matched_pay: p.pay_id }); l.matched_pay = p.pay_id; }\n    } else {\n      const near = cand.filter(l => !l.matched_pay && Math.abs(num(l.amount) - amt) <= 5).sort((x, y) => Math.abs(num(x.amount) - amt) - Math.abs(num(y.amount) - amt))[0];\n      if (near) { st = 'diff'; note = `พบ ${fmt(near.amount)} บาท (${near.date}) ต่างจากสลิป ${fmt(Math.abs(num(near.amount) - amt))} บาท`; } else st = 'not_found';\n    }\n    if (p.bank_status !== st || (p.bank_note || '') !== note) patch('Payments', p, { bank_status: st, bank_note: note });\n    res[st]++;\n  });\n  return res;\n}\nfunction autoConfirmMatched() {   // ปิดไว้เป็นค่าเริ่มต้น (ต้องกรรมการอนุมัติเปิด) ยืนยันเฉพาะสลิปที่ผูกใบแจ้ง ยอดตรง และไม่มีสลิปอื่นยอดเดียวกันใกล้เคียง\n  if (!isTrue(setting('AUTO_CONFIRM_BANK_MATCH'))) return 0;\n  const max = num(setting('AUTO_CONFIRM_MAX')) || 5000, pend = rows('Payments').filter(p => p.status === 'pending'); let n = 0;\n  pend.forEach(p => {\n    if (p.bank_status !== 'found' || !p.intent_id || p.dup_note || num(p.amount) > max) return;\n    if (pend.some(x => x.pay_id !== p.pay_id && Math.abs(num(x.amount) - num(p.amount)) < 0.005 && Math.abs(dayDiff(x.paid_on || '2000-01-01', p.paid_on || '2000-01-01')) <= 2)) return;\n    const it = findOne('Intents', 'intent_id', p.intent_id);\n    if (!it || it.status !== 'slip_sent' || Math.abs(num(it.total) - num(p.amount)) > 0.005) return;\n    try { ROUTES.verifyPayment.fn({ display_name: 'ระบบ (ยอดเข้าตรงสเตตเมนต์)', role: 'manager', house_no: '', line_user_id: 'SYSTEM' }, { pay_id: p.pay_id, approve: true }); n++; }\n    catch (e) { audit(null, 'AUTO_CONFIRM_FAIL', { pay: p.pay_id, err: String(e.message) }); }\n  });\n  return n;\n}\nfunction runAllCore() {\n  const out = {};\n  try { out.csv = readLatestCSV(); } catch (e) { out.csv = { error: String(e.message) }; console.error('readLatestCSV: ' + e.message); }\n  out.match = matchPayments(); out.auto = autoConfirmMatched();\n  PropertiesService.getScriptProperties().setProperty('BANK_LAST_RUN', JSON.stringify(Object.assign({ at: now() }, out)));\n  console.log(JSON.stringify(out)); return out;\n}\nfunction runAll() {   // ตัวตั้งเวลา/เมนู: อ่าน CSV → จับคู่ → (ยืนยันอัตโนมัติถ้าเปิด)\n  const lock = LockService.getScriptLock();\n  if (!lock.tryLock(25000)) { console.log('ระบบกำลังทำงานอื่นอยู่ ข้ามรอบนี้'); return null; }\n  try { return runAllCore(); } finally { lock.releaseLock(); }\n}\nfunction menuRunNow() {\n  try {\n    const r = runAll(), ui = SpreadsheetApp.getUi();\n    ui.alert('ตรวจสอบเงินเข้า', r ? `ไฟล์: ${r.csv.file || '-'}${r.csv.error ? '\\nข้อผิดพลาด: ' + r.csv.error : ''}\\nเพิ่มรายการเงินเข้า: ${r.csv.added || 0}\\n✅ เงินเข้าแล้ว ${r.match.found} • ⚠️ ยอดไม่ตรง ${r.match.diff} • ❌ ยังไม่พบ ${r.match.not_found}\\nยืนยันอัตโนมัติ ${r.auto} รายการ` : 'ระบบกำลังทำงานอื่นอยู่ ลองใหม่อีกครั้ง', ui.ButtonSet.OK);\n  } catch (e) { SpreadsheetApp.getUi().alert('ผิดพลาด: ' + e.message); }\n}\nfunction onOpen() { SpreadsheetApp.getUi().createMenu('ตรวจสอบเงินเข้า').addItem('Run Now', 'menuRunNow').addItem('ติดตั้งตัวตั้งเวลาทุก 30 นาที', 'installBankTrigger').addToUi(); }\nfunction installBankTrigger() {\n  ScriptApp.getProjectTriggers().filter(t => t.getHandlerFunction() === 'runAll').forEach(t => ScriptApp.deleteTrigger(t));\n  ScriptApp.newTrigger('runAll').timeBased().everyMinutes(30).create();\n}\nfunction logoUrl() { const id = logoId(); return id ? 'https://drive.google.com/thumbnail?id=' + id + '&sz=w256' : ''; }\n// LOGO_FILE รับได้ทั้ง File ID, ลิงก์ Google Drive หรือชื่อไฟล์ (เช่น Logo-Pink.jpg)\n// ถ้าเป็นชื่อไฟล์: ค้นใน Drive ครั้งเดียว เปิดสิทธิ์ \"ทุกคนที่มีลิงก์ดูได้\" แล้วบันทึก ID กลับลงชีตแทน\nfunction logoId() {\n  const raw = String(setting('LOGO_FILE') || '').trim();\n  if (!raw) return '';\n  const m = raw.match(/\\/d\\/([\\w-]{20,})/) || raw.match(/[?&]id=([\\w-]{20,})/);\n  if (m) return m[1];\n  if (/^[\\w-]+$/.test(raw)) return raw;            // File ID (ไม่มีจุด/ช่องว่าง) ถ้าเป็นชื่อไฟล์ให้ใส่นามสกุลด้วย เช่น .jpg\n  const cache = CacheService.getScriptCache(), ck = 'logo_miss_' + Utilities.base64EncodeWebSafe(raw).slice(0, 60);\n  if (cache.get(ck)) return '';                       // เพิ่งค้นไม่เจอ ไม่ค้นซ้ำทุกครั้ง\n  try {\n    let it = null;\n    const fid = setting('DRIVE_FOLDER_ID');\n    if (fid) { try { it = DriveApp.getFolderById(fid).getFilesByName(raw); if (!it.hasNext()) it = null; } catch (e) { it = null; } }\n    if (!it) it = DriveApp.getFilesByName(raw);\n    if (!it.hasNext()) { cache.put(ck, '1', 600); return ''; }\n    const f = it.next();\n    if (!/^image\\//.test(f.getMimeType())) { cache.put(ck, '1', 600); return ''; }\n    try { f.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW); } catch (e) { }\n    setSettingValue('LOGO_FILE', f.getId());\n    return f.getId();\n  } catch (e) { cache.put(ck, '1', 600); return ''; }\n}\n\n/* ======================= รปภ. / รถเข้า-ออก ======================= */\nconst PURPOSES = { visit: 'เยี่ยมบ้าน', contractor: 'ช่าง/ผู้รับเหมา', taxi: 'แท็กซี่', ride: 'รถรับจ้าง/แกร็บ', courier: 'ขนส่งเอกชน', post: 'ไปรษณีย์', delivery: 'ส่งของ (แบบเดิม)', other: 'อื่นๆ' };\nconst SERVICE_PURPOSES = ['taxi', 'ride', 'courier', 'post', 'delivery'];   // รถบริการ: เข้า-ออกได้ทันที ไม่ต้องรออนุมัติ\nconst plateKey = x => String(x || '').toUpperCase().replace(/[\\s\\-]/g, '');\nconst stampMs = s => { const m = String(s || '').match(/(\\d{4})-(\\d\\d)-(\\d\\d)[T ](\\d\\d):(\\d\\d)(?::(\\d\\d))?/); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) : NaN; };\nconst minutesSince = s => { const a = stampMs(s), b = stampMs(now()); return isFinite(a) && isFinite(b) ? Math.max(0, Math.round((b - a) / 60000)) : 0; };\nconst visitView = v => {\n  const svc = v.status === 'service', dwell = svc ? minutesSince(v.entered_at) : null, lim = num(setting('SERVICE_MAX_MIN')) || 60;\n  return { id: v.visit_id, plate: v.plate, house_no: v.house_no, purpose: v.purpose, card_no: v.card_no, entered_at: v.entered_at, entered_by: v.entered_by, status: v.status,\n    decided_by: v.decided_by, decided_at: v.decided_at, note: v.note, left_at: v.left_at, photo_file: v.photo_file, exit_photo_file: v.exit_photo_file || '', guest: !!v.guest_id,\n    overnight: v.status !== 'left' && v.day < today(), service: SERVICE_PURPOSES.includes(v.purpose), dwell_min: dwell, over_limit: svc && dwell > lim };\n};\n// ลบไฟล์ถาวร (PDPA): ถ้าเปิด Advanced Drive Service (Drive API) จะลบทันที ไม่งั้นย้ายไปถังขยะ (Google ลบถาวรหลัง 30 วัน)\nfunction purgeFile(id) {\n  if (!id) return;\n  try { if (typeof Drive !== 'undefined' && Drive.Files && Drive.Files.remove) { Drive.Files.remove(id); return; } } catch (e) { }\n  try { DriveApp.getFileById(id).setTrashed(true); } catch (e) { }\n}\nfunction purgeVisits() {   // PDPA: ลบรูป/ทะเบียนเมื่อพ้นระยะเก็บ: รถบริการ 30 วัน · เยี่ยม/ผู้รับเหมา 90 วัน · รูปบัตรประชาชน 30 วัน (ตั้งค่าได้) เหลือเฉพาะบันทึกเวลา-บ้าน\n  const keepV = num(setting('VISIT_RETENTION_DAYS')) || 90, keepS = num(setting('SERVICE_PHOTO_RETENTION_DAYS')) || 30, keepI = num(setting('ID_PHOTO_RETENTION_DAYS')) || 30;\n  rows('Visits').filter(v => v.day).forEach(v => {\n    const ch = {};\n    if (v.id_photo_file && v.day < addDays(today(), -keepI)) { purgeFile(v.id_photo_file); ch.id_photo_file = ''; }\n    const cut = addDays(today(), -(SERVICE_PURPOSES.includes(v.purpose) ? keepS : keepV));\n    if (v.day < cut && (v.photo_file || v.exit_photo_file || v.plate !== '(ลบแล้ว)')) { purgeFile(v.photo_file); purgeFile(v.exit_photo_file); purgeFile(v.id_photo_file); Object.assign(ch, { photo_file: '', exit_photo_file: '', id_photo_file: '', plate: '(ลบแล้ว)' }); }\n    if (Object.keys(ch).length) patch('Visits', v, ch);\n  });\n  rows('Guests').filter(g => g.valid_date < addDays(today(), -30)).forEach(g => removeRow('Guests', g));\n}\nfunction expireExceptions() {   // คำขอยกเว้นผู้รับเหมาที่ไม่มีใครตัดสินจนเลยวัน → หมดอายุ แจ้งผู้ขอ\n  rows('Guests').filter(g => g.kind === 'contractor' && g.exc_status === 'pending' && g.valid_date < today()).forEach(g => {\n    patch('Guests', g, { exc_status: 'expired', status: 'expired' });\n    lineSend([g.req_uid], textMsg(`⌛ คำขอยกเว้นผู้รับเหมา ${g.company} วันที่ ${g.valid_date} หมดอายุ (ไม่มีกรรมการตัดสินก่อนถึงวัน)`), 'low');\n  });\n}\nfunction overnightAlert() {\n  const t = today(), left = rows('Visits').filter(v => v.status !== 'left' && v.day < t);\n  if (!left.length) return;\n  const txt = `🌙 รถ/บุคคลที่ยังอยู่ในหมู่บ้านข้ามคืน ${left.length} รายการ: ` + left.slice(0, 8).map(v => `${v.plate} (บ้าน ${v.house_no})`).join(', ');\n  notifyRoles(['guard'], txt, 'critical'); notifyRoles(['committee'], txt, 'low');\n}\n\n/* ======================= MEETINGS / CREDIT HELPERS ======================= */\nfunction creditAvailable(house) {\n  const h = findOne('Houses', 'house_no', house);\n  const held = sum(rows('CreditMoves').filter(m => eq(m.from_house, house) && m.status === 'pending'), m => m.amount);\n  return Math.max(0, round2(num(h && h.credit) - held));\n}\nfunction rosterList() {\n  const roster = rows('Committee');\n  return committeeUsers().map(c => { const r = roster.find(x => x.uid === c.line_user_id) || {};\n    return { uid: c.line_user_id, name: r.name || c.display_name, position: r.position || '', house_no: c.house_no, term_start: r.term_start || '', term_end: r.term_end || '', meeting_id: r.meeting_id || '', office: isTrue(c.office) }; });\n}\nfunction expireCommittee() {   // หมดวาระแล้วปิดสิทธิ์กรรมการอัตโนมัติ\n  const t = today();\n  rows('Committee').filter(r => !r.note && r.term_end && r.term_end < t).forEach(r => {\n    const u = findOne('Users', 'line_user_id', r.uid);\n    if (u && u.role === 'committee') patch('Users', u, { role: 'resident', office: 'FALSE' });\n    patch('Committee', r, { note: 'หมดวาระ ' + r.term_end });\n    notifyRoles(['committee'], `ℹ️ ${r.name} หมดวาระกรรมการ (${r.term_end}) ระบบปิดสิทธิ์กรรมการแล้ว`, 'normal');\n  });\n}\nfunction migrateAccounts() {   // ผู้ใช้เดิมที่ยังไม่มีประเภทบัญชี: คนแรกของบ้าน = หลัก ที่เหลือ = สำรอง, กรรมการ = นิติฯ ด้วย\n  const seen = {};\n  rows('Users').filter(u => u.house_no && u.acct_type).forEach(u => { if (u.acct_type === 'main') seen[u.house_no] = 1; });\n  rows('Users').forEach(u => {\n    const ch = {};\n    if (u.house_no && !u.acct_type && ['resident', 'committee', 'manager'].includes(u.role)) { ch.acct_type = seen[u.house_no] ? 'backup' : 'main'; seen[u.house_no] = 1; }\n    if (u.role === 'committee' && !u.office) ch.office = 'TRUE';\n    if (Object.keys(ch).length) patch('Users', u, ch);\n  });\n}\nfunction meetingNotify(m, text) {\n  if ((m.visibility || 'all') === 'committee') notifyRoles(STAFF, text); else notifyAll(text);\n}\nfunction meetingView(m, u) {\n  const staff = STAFF.includes(u.role), type = m.type || 'general', status = m.status || 'closed';\n  const vis = m.visibility || (BY_USER_TYPES.includes(type) ? 'committee' : 'all');\n  const byHouse = !BY_USER_TYPES.includes(type), att = JSON.parse(m.attendees_json || '[]');\n  const houses = rows('Houses').filter(h => h.house_no).length, count = byHouse ? new Set(att.map(a => a.house_no)).size : att.length;\n  const pct = byHouse && houses ? Math.round(count / houses * 1000) / 10 : null, req = num(setting('MEETING_QUORUM_PCT'));\n  const out = { meeting_id: m.meeting_id, title: m.title, type, type_th: MEETING_TYPES[type], meeting_date: m.meeting_date, start_time: m.start_time || '',\n    location: m.location || '', visibility: vis, status, agenda: JSON.parse(m.agenda_json || '[]'), notice_sent_at: m.notice_sent_at || '',\n    attendance: { count, total: houses, pct, by_house: byHouse, required_pct: req, quorum_met: req && pct !== null ? pct >= req : null,\n      mine: att.some(a => byHouse ? eq(a.house_no, u.house_no) : a.uid === u.line_user_id) } };\n  if (staff || status === 'closed') Object.assign(out, { minutes_text: m.minutes_text || '', summary: m.summary || '',\n    resolutions: JSON.parse(m.resolutions_json || '[]'), minutes_file: m.minutes_file || '' });\n  if (staff) Object.assign(out, { attendees: att, minutes_by: m.minutes_by || '', minutes_votes: JSON.parse(m.minutes_votes_json || '[]'),\n    minutes_required: num(setting('MINUTES_APPROVALS_REQUIRED')) || 1 });\n  return out;\n}\nfunction meetingReminders() {   // เตือนวันก่อนประชุม\n  const tomorrow = Utilities.formatDate(new Date(new Date(today()).getTime() + 86400000), TZ, 'yyyy-MM-dd');\n  rows('Meetings').filter(m => m.status === 'noticed' && m.meeting_date === tomorrow).forEach(m =>\n    meetingNotify(m, `⏰ พรุ่งนี้มี${MEETING_TYPES[m.type] || 'ประชุม'}: ${m.title}\nเวลา ${m.start_time || '-'} น. สถานที่ ${m.location || '-'}`));\n}\n\n/* ======================= RECALC & ADJUSTMENTS ======================= */\nfunction forfeitDiscounts() {\n  const t = today();\n  const pend // เรียก API พร้อมจัดการคำถามจากเซิร์ฟเวอร์: CONFIRM:<flag>|<ข้อความ> (ให้ยืนยัน) และ NEEDTEXT:<field>|<ข้อความ> (ให้พิมพ์เหตุผล)
async function callX(action, data) {
  for (;;) {

function fileOf(id) {
  return new Promise(res => {
    const f = document.getElementById(id)?.files?.[0];
    if (!f) return res(null);
    if (!f.type.startsWith('image/')) {
      const fr = new FileReader();
      fr.onload = () => res({ file: fr.result.split(',')[1], mime: f.type });
      return fr.readAsDataURL(f);
    }
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res({ file: c.toDataURL('image/jpeg', 0.75).split(',')[1], mime: 'image/jpeg' });
    };
    img.src = URL.createObjectURL(f);
  });
}

async function vAdjust() {
  const [d, cm] = await Promise.all([api('listAdjustments'), api('listCreditMoves')]);
  const AST = { pending: 'รออนุมัติ', applied: 'มีผลแล้ว', rejected: 'ไม่อนุมัติ' };
  const card = a => `<div class="card"><div class="row">
      <b>บ้าน ${esc(a.house_no)} | ${Number(a.amount) < 0 ? 'ลดยอด' : 'เพิ่มยอด'} ${baht(Math.abs(a.amount))} บาท</b>
      <span class="badge ${a.status === 'applied' ? 'done' : a.status}">${AST[a.status] || a.status}</span></div>
    <small>บิลงวด ${esc(a.period || a.invoice_id)} | ขอโดย ${esc(a.created_by)} ${dt(a.created_at)}</small>
    <div>เหตุผล: ${esc(a.reason)}</div>
    ${a.status === 'pending' ? `<div><small>อนุมัติแล้ว ${a.approvals.length}/${d.required}: ${a.approvals.map(x => esc(x.name)).join(', ') || '-'}</small></div>` : ''}
    ${a.decided_note ? `<div><small>${esc(a.decided_note)}</small></div>` : ''}
    ${ISCOM() && a.status === 'pending' && !a.approvals.some(x => x.id === ME.line_user_id)
      ? `<button class="btn" onclick="decideAdj('${a.adj_id}',true)">อนุมัติ</button>
         <button class="btn sec" onclick="decideAdj('${a.adj_id}',false)">ไม่อนุมัติ</button>` : ''}</div>`;
  const pend = d.list.filter(a => a.status === 'pending'), done = d.list.filter(a => a.status !== 'pending');
  return `<h4>รออนุมัติ (${pend.length})</h4>${pend.map(card).join('') || '<p><small>ไม่มี</small></p>'}
    <h4>ประวัติการปรับยอด</h4>${done.map(card).join('') || '<p><small>ไม่มี</small></p>'}
    <h4>💱 คืนเงิน/โอนเครดิตข้ามบ้าน (${cm.filter(c => c.status === 'pending' || c.status === 'approved').length} รอดำเนินการ)</h4>${cm.map(c => cmCard(c, true)).join('') || '<p><small>ไม่มี</small></p>'}`;
}

  try {
    const r = await api('adjustInvoice', { invoice_id: id, amount: amt, reason: val('ar_' + id) });

}

let PAY = { mode: 'sel', sel: new Set(), pkg: null, custom: '', step: 'choose', intent: null }, POPT = null, PACC = null, PCM = [], BF = 'all';

function qrSvg(text) { needLib('lib_qr'); const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); }
const itemLabel = i => i.kind === 'month' ? 'ค่าส่วนกลาง ' + mlabel(i.month) : i.kind === 'package' ? 'แพ็กเกจ ' + i.period : 'บิล ' + i.period + (i.note ? ' (' + i.note + ')' : '');
function payTotals() {
  const pk = POPT.packages.find(x => x.id === PAY.pkg), cov = new Set(pk ? pk.months : []);
  if (PAY.mode === 'custom') return { total: Math.round((Number(PAY.custom) || 0) * 100) / 100, lines: [] };
  const lines = POPT.items.filter(i => PAY.sel.has(i.invoice_id) && !i.locked && !(pk && i.month && cov.has(i.month))).map(i => ({ label: itemLabel(i), amt: i.outstanding }));
  if (pk) lines.push({ label: `แพ็กเกจ ${pk.label} (${pk.months.length} เดือน, ลด ${pk.pct}%)`, amt: pk.amount });
  return { total: Math.round(lines.reduce((s, x) => s + x.amt, 0) * 100) / 100, lines };
}
const payRender = () => { $('#app').innerHTML = (PAY.step === 'qr' && PAY.intent) ? payQR() : (PAY.step === 'slip' && PAY.intent) ? paySlip() : payHtml(); };
function payToggle(id) { PAY.sel.has(id) ? PAY.sel.delete(id) : PAY.sel.add(id); payRender(); }
function payQuick(w) { PAY.sel = new Set(POPT.items.filter(i => !i.locked && (w === 'all' || (w === 'cur' && i.is_current) || (w === 'arr' && i.overdue))).map(i => i.invoice_id)); payRender(); }
function payPkg(id) { PAY.pkg = PAY.pkg === id ? null : id; payRender(); }
function payCustom(v) { PAY.custom = v; const el = document.getElementById('tot'); if (el) el.textContent = baht(payTotals().total); }

  <h4>ประวัติการชำระ (ทุกสลิป)</h4>${a.payments.map(payCard).join('') || '<p><small>ยังไม่มี</small></p>'}

function setBF(x) { BF = x; payRender(); }
function openIntent(id) { PAY.intent = POPT.intents.find(i => i.intent_id === id); PAY.step = 'qr'; payRender(); window.scrollTo(0, 0); }
async function makeIntent() {
  const T = payTotals(); if (!(T.total > 0)) return alert('กรุณาเลือกรายการที่จะชำระ');
  if (BUSY) return; BUSY = true;
  try {
    PAY.intent = await api('createIntent', PAY.mode === 'custom' ? { mode: 'custom', amount: PAY.custom } : { invoice_ids: [...PAY.sel], pkg: PAY.pkg || undefined });
    PAY.step = PAY.intent.qr_payload ? 'qr' : 'slip'; payRender(); window.scrollTo(0, 0);   // ปิด QR: ไปหน้าแนบสลิปเลย

}

  return `<div class="card center"><b>${has ? 'สแกนจ่ายด้วยแอปธนาคาร' : 'โอนเข้าบัญชีนิติบุคคล'}</b>

    <label class="lb">อัปโหลดรูป QR รับเงินที่ได้จากธนาคาร (QR ของนิติบุคคล)</label><input type="file" id="qr_file" accept="image/*" onchange="onQrPicked()">

function reqSetting() { act('requestChange', { kind: 'setting', key: val('pk') || SV.rules[0].key, value: val('pv'), reason: val('pr') }, 'ส่งขออนุมัติแล้ว ไปที่แท็บ "รออนุมัติ"'); }
async function onQrPicked() {
  const f = $('#qr_file').files[0]; if (!f) return;
  try {
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('เปิดรูปไม่ได้')); im.src = URL.createObjectURL(f); });
    const k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
    needLib('lib_jsqr'); const code = jsQR(g.getImageData(0, 0, c.width, c.height).data, c.width, c.height);
    if (!code) { QRP = { info: { ok: false, why: 'อ่าน QR จากรูปไม่ได้ ลองถ่าย/บันทึกภาพใหม่ให้ชัดและเห็น QR ทั้งอัน' } }; }
    else QRP = { payload: code.data, info: await api('qrPreview', { payload: code.data }) };
  } catch (e) { QRP = { info: { ok: false, why: e.message } }; }
  policyRender();
}
async function previewBiller() {
  try { const r = await api('qrPreview', { tax_id: val('qr_tax'), suffix: val('qr_suffix'), name: val('qr_bname') }); QRP = { payload: r.payload, info: r }; }
  catch (e) { QRP = { info: { ok: false, why: e.message } }; }
  policyRender();
}
function reqQr() { act('requestChange', { kind: 'promptpay', payload: QRP.payload, reason: val('qr_reason') }, 'ส่งขออนุมัติแล้ว ไปที่แท็บ "รออนุมัติ"'); QRP = null; }

function logoOf() {
  return new Promise((res, rej) => {
    const f = document.getElementById('br_file') && document.getElementById('br_file').files[0]; if (!f) return res(null);
    const im = new Image(); im.onerror = () => rej(new Error('เปิดรูปโลโก้ไม่ได้'));

  });
}

    ? '<p><b>ตรวจ LIFF ID:</b> แอปนี้ใช้ <b>' + esc(CONFIG.LIFF_ID) + '</b><br>ต้องตรงกับ LIFF ID ของ LINE Login channel ปัจจุบัน (คอนโซล LINE Developers → LINE Login channel → แท็บ LIFF) และต้องเปิดจากลิงก์ <b>https://liff.line.me/' + esc(CONFIG.LIFF_ID) + '</b> ในแอป LINE</p>' : '')
    + '<button class="btn sec" onclick="location.reload()">ลองใหม่</button></div>';
}));
</script>
</body>
</html>
