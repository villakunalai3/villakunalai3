<style>

a{color:var(--blu)}
img{max-width:100%;border-radius:12px;margin-top:6px}

tr.click{cursor:pointer}.red{color:var(--red)}

.sk{height:84px;border-radius:16px;background:linear-gradient(90deg,#8881,#8883,#8881);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}

.sk.hero-sk{height:150px;background:linear-gradient(90deg,var(--pri)22,var(--pri)44,var(--pri)22);background-size:200% 100%}
body::before{content:"";position:fixed;top:0;left:0;height:3px;width:0;z-index:50;background:linear-gradient(90deg,var(--pri),#f7a8cd,var(--pri));background-size:200% 100%;opacity:0;transition:opacity .2s}

.card{transition:transform .12s,box-shadow .2s}.card[onclick]:active,.card.tile:active{transform:scale(.985)}

.btn.sec{box-shadow:none}

.badge.pending{background:#e08a0022;color:var(--amb);border-color:#e08a0044}.badge.paid{background:#e03f8b22;color:var(--pri2);border-color:#e03f8b44}

.paid{color:var(--pri2)}.open{color:var(--amb)}.late{color:var(--red)}

<script>/* ส่วนที่ทำงานก่อนแอป: จำลอง LINE (liff) และดักการเรียก API ไปยังระบบหลังบ้านจำลองในหน้านี้ */
(function () {
  const PERSONAS = new Set(['somchai','napa','ruen','lek','newbie','sura','wipa','thana','nathi','mali','g1','hk','boss']);
  let p = 'somchai'; try { const s = localStorage.getItem('demo_persona'); if (PERSONAS.has(s)) p = s; } catch (e) {}
  window.DEMO_PERSONA = p;
  window.liff = {
    init: async () => {}, isLoggedIn: () => true, isInClient: () => false, login() {}, logout() {},
    getIDToken: () => window.__H.jwt(window.DEMO_PERSONA), getDecodedIDToken: () => ({ sub: window.DEMO_PERSONA })
  };
  const real = window.fetch.bind(window);
  window.fetch = function (u, o) {
    if (String(u).indexOf('https://demo.invalid') !== 0) return real(u, o);
    return new Promise(res => setTimeout(() => {
      let t; try { t = window.__H.ctx.doPost({ postData: { contents: o.body } }).t; } catch (e) { t = JSON.stringify({ ok: false, error: 'demo: ' + (e && e.message || e) }); }
      window.__demoSave && window.__demoSave();
      res(new Response(t, { status: 200, headers: { 'Content-Type': 'application/json' } }));
    }, 40 + Math.random() * 60));
  };
})();
</script>

  function sha256(m) {
    const l = m.length, n = ((l + 9 + 63) >> 6) << 6, p = new Uint8Array(n); p.set(m); p[l] = 0x80;
    const dv = new DataView(p.buffer); dv.setUint32(n - 4, (l * 8) >>> 0); dv.setUint32(n - 8, Math.floor(l / 0x20000000));

  const SKIP = new Set(['Math', 'JSON', 'Set', 'Map', 'Object', 'Array', 'String', 'Number', 'RegExp', 'Error', 'isNaN', 'parseInt', 'parseFloat', 'isFinite', 'console', 'setTimeout']);

|2[0-3]):[0-5]\\d$/.test(String(x || '')) ? String(x) : '';\nfunction contractorHours() { const m = String(setting('CONTRACTOR_HOURS') || '').match(/^(\\d\\d:\\d\\d)-(\\d\\d:\\d\\d)$/); return m && hhmm(m[1]) && hhmm(m[2]) && m[1] < m[2] ? [m[1], m[2]] : ['08:00', '17:00']; }\nfunction blockedDays() { const v = String(setting('CONTRACTOR_BLOCK_DAYS') || '0').trim(); return v === 'none' ? [] : v.split(',').map(x => x.trim()).filter(x => /^[0-6]$/.test(x)).map(Number); }\n// ตรวจวัน/เวลาทำงานของผู้รับเหมา: ok=false แปลว่าต้องขอยกเว้น (why = เหตุผล)\nfunction contractorRule(date, from, to) {\n  const hrs = contractorHours(), why = [];\n  if (blockedDays().includes(dayOf(date))) why.push('ทำงานวัน' + DAY_TH[dayOf(date)] + 'ไม่ได้');\n  if ((from && from < hrs[0]) || (to && to > hrs[1])) why.push('ทำงานนอกเวลา ' + hrs[0] + '–' + hrs[1] + ' ไม่ได้');\n  return { ok: !why.length, why: why.join(' และ ') };\n}\nconst guestPlates = g => [g.plate].concat(String(g.plates || '').split('|')).filter(Boolean);\nconst plateIn = (g, plate) => guestPlates(g).some(x => plateKey(x) === plateKey(plate));\nconst excView = (g, u) => { const st = u && (u.role === 'committee' || u.isAdmin) ? voteBasic(u, { requester: g.req_uid, houses: [g.house_no], ap: [] }) : { ok: false };\n  return { id: g.guest_id, house_no: g.house_no, name: g.name, company: g.company, workers: g.workers, work_type: g.work_type, plates: guestPlates(g), valid_date: g.valid_date, day_th: DAY_TH[dayOf(g.valid_date)],\n    win_from: g.win_from, win_to: g.win_to, exc_status: g.exc_status, exc_reason: g.exc_reason, exc_by: g.exc_by, exc_at: g.exc_at, exc_note: g.exc_note, requested_by: g.created_by, requested_at: g.created_at, can_decide: g.exc_status === 'pending' && !!st.ok, why: st.ok ? '' : (st.why || '') }; };\n// ตารางหลักเกณฑ์การอนุมัติ: ระดับกำหนดจาก \"ประเภทรายการ\" เท่านั้น (ผู้ขอเลือกเองไม่ได้)\nconst APPROVAL_MATRIX = [\n  { kind: 'contractor_exception', label: 'ผู้รับเหมาวันอาทิตย์/นอกเวลา (ลูกบ้านลงทะเบียนล่วงห SSION_MIN')) || 30)));\n    audit(u, 'setPin', {}); return true;\n  }},\n\n  verifyPin: { fn: (u, d) => {\n    if (!STAFF.includes(u.realRole) && !u.isAdminReal) throw new Error('เฉพาะกรรมการ/นิติฯ/ผู้ดูแลระบบ');\n    const row = findOne('Users', 'line_user_id', u.line_user_id);\n    if (!row.pin_hash) throw new Error('ยังไม่ได้ตั้ง PIN');\n    if (pinLocked(u)) throw new Error('ใส่ PIN ผิดหลายครั้ง ล็อกชั่วคราว 15 นาที');\n    const ok = hashPin(String(d.pin || ''), row.pin_salt) === row.pin_hash;\n    pinAttempt(u, ok);\n    if (!ok) throw new Error('PIN ไม่ถูกต้อง');\n    CacheService.getScriptCache().put('pin_' + u.line_user_id, '1', Math.min(21600, 60 * (num(setting('PIN_SESSION_MIN')) || 30)));\n    audit(u, 'pinLogin', {}); return true;\n  }},\n\n  lockPin: { fn: u => { CacheService.getScriptCache().remove('pin_' + u.line_user_id); return true; } },\n\n  register: { roles: ['guest'], fn: (u, d) => {\n    const house = String(d.house_no || '').trim();\n    if (!d.name || String(d.name).length > 80) throw new Error('กรุณากรอกชื่อ (ไม่เกิน 80 ตัวอักษร)');\n    if (rows('Users').length > 400) throw new Error('จำนวนผู้ลงทะเบียนเต็ม กรุณาติดต่อนิติบุคคล');\n    const base = { line_user_id: u.line_user_id, display_name: String(d.name).trim(), phone: String(d.phone || '').slice(0, 20), role: 'resident', active: 'FALSE', created_at: now() };\n    if (d.is_staff) {\n      insert('Users', Object.assign(base, { house_no: '' }));\n      notifyRoles(['manager'], `👤 คำขอลงทะเบียนเจ้าหน้าที่ (รปภ./ช่าง): ${base.display_name}`, 'normal');\n      return true;\n    }\n    if (!findOne('Houses', 'house_no', house)) throw new Error('ไม่พบบ้านเลขที่นี้ในระบบ');\n    const type = d.acct_type === 'backup' ? 'backup' : 'main';\n    const mine = rows('Users').filter(x => eq(x.house_no, house) && x.acct_type);\n    const main = mine.find(x => x.acct_type === 'main'), backups = mine.filter(x => x.acct_type === 'backup');\n    if (type === 'main' && main) throw new Error('บ้านนี้มีบัญชีห อ ${left} วัน\\nยืนยันประกาศต่อหรือไม่?`);\n    const v = meetingView(m, u), agenda = v.agenda.map((a, i) => `${i + 1}. ${a.title}`).join('\\n');\n    const text = `📅 ${m.status === 'noticed' ? '(ประกาศซ้ำ) ' : ''}ประกาศนัด${v.type_th}\\nเรื่อง: ${m.title}\\nวันที่ ${m.meeting_date}${m.start_time ? ' เวลา ' + m.start_time + ' น.' : ''}\\nสถานที่: ${m.location || '-'}` +\n      (agenda ? `\\nวาระ:\\n${agenda}` : '') + (v.visibility === 'all' ? '\\n\\nเช็กอินเข้าร่วมในแอปได้ในวันประชุม' : '');\n    patch('Meetings', m, { status: 'noticed', notice_sent_at: now() });\n    if (v.visibility === 'all') {\n      insert('Announcements', { ann_id: uid('ANN'), title: `นัด${v.type_th}: ${m.title}`, body: text, created_by: u.display_name, created_at: now() });\n      notifyAll(text);\n    } else notifyRoles(STAFF, text);\n    audit(u, 'noticeMeeting', { id: m.meeting_id });\n    return true;\n  }},\n\n  cancelMeeting: { roles: STAFF, fn: (u, d) => {\n    const m = findOne('Meetings', 'meeting_id', d.meeting_id);\n    if (!m || !['draft', 'noticed'].includes(m.status)) throw new Error('ยกเลิกได้เฉพาะการประชุมที่ยังไม่จัด');\n    patch('Meetings', m, { status: 'cancelled' });\n    if (m.status === 'noticed') meetingNotify(m, `❌ ยกเลิกการประชุม \"${m.title}\" วันที่ ${m.meeting_date}${d.reason ? '\\nเหตุผล: ' + d.reason : ''}`);\n    audit(u, 'cancelMeeting', d);\n    return true;\n  }},\n\n  checkinMeeting: { roles: MEMBER, fn: (u, d) => {\n    const m = findOne('Meetings', 'meeting_id', d.meeting_id);\n    if (!m || !['noticed', 'held'].includes(m.status)) throw new Error('ยังไม่เปิดให้เช็กอิน');\n    if (m.visibility === 'committee' && !STAFF.includes(u.role)) throw new Error('การประชุมนี้สำหรับคณะกรรมการ/นิติบุคคล');\n    if (m.meeting_date !== today()) throw new Error('เช็กอินได้เฉพาะในวันประชุม');\n    const byUser = BY_USER_TYPES.includes(m.type), att = JSON.parse(m.attendees_json || '[]');\n    if (!byUser && !u.house_no) throw new Error('บัญชีนี้ไม่ได้ผูกกับบ้านเลขที่');\n ป)');\n    } else patch('Meetings', m, ch);\n    audit(u, 'approveMinutes', { id: m.meeting_id, n: votes.length });\n    return ch.status || 'minutes_draft';\n  }},\n\n  addMeeting: { roles: STAFF, fn: (u, d) => {   // บันทึกการประชุมย้อนหลัง (อัปโหลดรายงานที่มีอยู่แล้ว)\n    if (!d.file || !d.title) throw new Error('กรุณาใส่ชื่อการประชุมและแนบไฟล์');\n    const id = uid('MTG');\n    insert('Meetings', { meeting_id: id, meeting_date: d.meeting_date, title: d.title, type: MEETING_TYPES[d.type] ? d.type : 'general',\n      visibility: BY_USER_TYPES.includes(d.type) ? 'committee' : 'all', status: 'closed', attendees_json: '[]', resolutions_json: '[]', minutes_votes_json: '[]',\n      minutes_file: saveFile(d.file, d.mime, 'minutes_' + id, false), created_by: u.display_name, created_at: now() });\n    return true;\n  }},\n\n  /* ------ คืนเครดิต / โอนเครดิตไปบ้านอื่น (มีหลักฐาน + กรรมการอนุมัติ) ------ */\n  requestCreditMove: { roles: MEMBER, fn: (u, d) => {\n    const kind = d.kind === 'transfer' ? 'transfer' : 'refund';\n    if (u.acct_type === 'backup' && !isOffice(u)) throw new Error('เฉพาะบัญชีหลักของบ้านเท่านั้นที่ขอคืน/โอนเครดิตได้');\n    const from = isOffice(u) ? String(d.from_house || u.house_no || '').trim() : u.house_no;\n    const h = findOne('Houses', 'house_no', from);\n    if (!h) throw new Error('ไม่พบบ้านต้นทาง');\n    const amount = round2(d.amount);\n    if (!(amount > 0)) throw new Error('จำนวนเงินไม่ถูกต้อง');\n    if (!d.reason) throw new Error('กรุณาระบุเหตุผล' + (kind === 'refund' ? ' และบัญชีรับเงินคืน' : ''));\n    if (amount > creditAvailable(from) + 0.005) throw new Error(`เครดิตที่ขอใช้ได้ ${fmt(creditAvailable(from))} บาท (หักรายการที่รออนุมัติแล้ว)`);\n    let to = '';\n    if (kind === 'transfer') {\n      to = String(d.to_house || '').trim();\n      if (!findOne('Houses', 'house_no', to) || eq(to, from)) throw new Error('บ้านปลายทางไม่ถูกต้อง');\n      if (!d.file) throw new Error('กรุณาแนบหลักฐาน (สลิปโอนเงิน) ประกอบการโอนเครดิต');\n    }\n    const id = uid('CMV');\n    insert('CreditMoves', { move_id: id, kind, from_house: from, to_house: to, amount, reason: String(d.reason).slice(0, 500),\n      evidence_file: saveFile(d.file, d.mime, 'move_' + id, false), requested_by: u.line_user_id, requested_name: u.display_name,\n      requested_at: now(), status: 'pending', approvals: '[]' });\n    notifyRoles(['committee'], `💱 ขอ${kind === 'refund' ? 'คืนเงินเครดิต' : 'โอนเครดิตไปบ้าน ' + to}\\nบ้าน ${from} จำนวน ${fmt(amount)} บาท\\nเหตุผล: ${d.reason}\\nต้องอนุมัติ ${setting('CREDIT_MOVE_APPROVALS_REQUIRED')} คน`);\n    audit(u, 'requestCreditMove', { id, kind, from, to, amount });\n    return id;\n  }},\n\n  listCreditMoves: { roles: MEMBER, fn: u => {\n    const staff = STAFF.includes(u.role);\n    return rows('CreditMoves').reverse().filter(m => staff || eq(m.from_house, u.house_no) || eq(m.to_house, u.house_no))\n      .map(m => Object.assign({}, m, { approvals: JSON.parse(m.approvals || '[]').map(a => staff ? a : { name: a.name }),\n        requested_by: staff ? m.requested_by : '', required: num(setting('CREDIT_MOVE_APPROVALS_REQUIRED')) || 1 }));\n  }},\n\n  decideCreditMove: { roles: ['committee'], fn: (u, d) => {\n    const m = findOne('CreditMoves', 'move_id', d.move_id);\n    if (!m || m.status !== 'pending') throw new Error('รายการนี้ไม่อยู่ในสถานะรออนุมัติ');\n    const ap = JSON.parse(m.approvals || '[]'), item = { requester: m.requested_by, houses: [m.from_house, m.to_house], ap, need: num(setting('CREDIT_MOVE_APPROVALS_REQUIRED')) };\n    const vb = voteBasic(u, item); if (!vb.ok) throw new Error(vb.why);\n    const label = `${m.kind === 'refund' ? 'คืนเงินเครดิต' : 'โอนเครดิตบ้าน ' + m.from_house + ' → ' + m.to_house} ${fmt(m.amount)} บาท`;\n    if (!d.approve) {\n      patch('CreditMoves', m, { status: 'rejected', done_at: now(), note: `ไม่อนุมัติโดย ${u.display_name}: ${d.reason || '-'}` });\n      notifyRoles(STAFF, `❌ ไม่อนุมัติ ${label}`); notifyHouse(m.from_house, `❌ คำขอ ${label} ไม่ได้รับอนุมัติ${d.reason ? ': ' + d.reason : ''}`);\n      audit(u, 'rejectCreditMove', d); return 'rejected';\n    }\n    const st = needVote(u, item, d.res);\n    ap.push(vEntry(u, st, d.res));\n    if (ap.length < st.need) {\n      patch('CreditMoves', m, { approvals: JSON.stringify(ap) });\n      notifyRoles(STAFF, `👍 ${u.display_name} อนุมัติ ${label} (${ap.length}/${st.need})`);\n      return 'pending';\n    }\n    const from = findOne('Houses', 'house_no', m.from_house);\n    if (num(from.credit) + 0.005 < num(m.amount)) {   // เครดิตถูกใช้หักบิลไปแล้วระหว่างรออนุมัติ\n      patch('CreditMoves', m, { approvals: JSON.stringify(ap), status: 'rejected', done_at: now(), note: 'เครดิตคงเหลือไม่พอ (ถูกใช้หักบิลแล้ว)' });\n      notifyRoles(STAFF, `⚠️ ยกเลิก ${label}: เครดิตคงเหลือไม่พอ`); return 'rejected';\n    }\n    patch('Houses', from, { credit: round2(num(from.credit) - num(m.amount)) });   // กันเครดิตไว้ทันทีที่อนุมัติครบ\n    if (m.kind === 'transfer') {\n      addCredit(m.to_house, num(m.amount));\n      patch('CreditMoves', m, { approvals: JSON.stringify(ap), status: 'done', done_at: now(), note: 'โอนเครดิตเรียบร้อย' });\n      applyCredit(m.to_house);\n      notifyHouse(m.from_house, `✅ อนุมัติโอนเครดิต ${fmt(m.amount)} บาท ไปบ้าน ${m.to_house} แล้ว`);\n      notifyHouse(m.to_house, `💰 ได้รับโอนเครดิต ${fmt(m.amount)} บาท จากบ้าน ${m.from_house} (หักบิลที่ค้างให้อัตโนมัติ)`);\n      audit(u, 'creditTransferDone', { id: m.move_id }); return 'done';\n    }\n    patch('CreditMoves', m, { approvals: JSON.stringify(ap), status: 'approved' });\n    notifyRoles(['manager'], `✅ อนุมัติ ${label} ครบแล้ว กรุณาโอนเงินคืนและแนบสลิป`);\n    notifyHouse(m.from_house, `✅ อนุมัติคืนเงินเครดิต ${fmt(m.amount)} บาท แล้ว รอนิติฯ โอนเงินคืน`);\n    audit(u, 'creditRefundApproved', { id: m.move_id }); return 'approved';\n  }},\n\n  completeRefund: { roles: ['manager'], fn: (u, d) => {\n    const m = findOne('CreditMoves', 'move_id', d.move_id);\n    if (!m || m.kind !== 'refund' || m.status !== 'approved') throw new Error('รายการนี้ยังไม่ได้รับอนุมัติครบ');\n    if (!d.file) throw new Error('กรุณาแนบสลิปการโอนเงินคืน');\n    patch('CreditMoves', m, { status: 'done', done_at: now(), paid_slip_file: saveFile(d.file, d.mime, 'refund_' + m.move_id, false), note: 'โอนเงินคืนแล้ว' });\n    notifyHouse(m.from_house, `💸 โอนเงินคืน ${fmt(m.amount)} บาท เรียบร้อยแล้ว`);\n    audit(u, 'completeRefund', { id: m.move_id }); return true;\n  }},\n\n  /* ---------------- กรรมการ: กล่องรออนุมัติรวม ---------------- */\n  inbox: { roles: ['committee'], fn: u => {\n    const items = [];\n    const add = (kind, id, o) => {\n      const it = { requester: o.requester, houses: o.houses || [], ap: o.ap, need: o.need }, rule = voteRule(it), st = voteState(u, it, undefined);\n      items.push({ kind, id, title: o.title, desc: o.desc || '', amount: o.amount || 0, requester_name: o.requester_name || '', requested_at: o.at || '', file: o.file || '',\n        approvals: o.ap.map(a => ({ name: a.name, at: a.at, res: a.res || '' })), need: rule.need, fallback: rule.fallback, eligible: rule.eligible.length,\n        can_vote: !!st.ok, needs_res: !!st.needsRes, why: st.why || '', critical: !!o.critical, voted: o.ap.some(a => a.id === u.line_user_id) });\n    };\n    rows('Expenses').filter(e => e.status === 'pending').forEach(e => add('expense', e.exp_id, { title: `เบิกจ่าย ${e.category}: ${e.description || ''}`, desc: `${fmt(e.amount)} บาท • ${e.vendor || ''}${e.source === 'recurring' ? ' • รายการประจำ' : ''}`, amount: e.amount,\n      requester: e.requested_by, requester_name: e.requested_name, need: num(setting('APPROVALS_REQUIRED')), ap: JSON.parse(e.approvals || '[]'), at: e.requested_at, file: e.bill_file }));\n    rows('Adjustments').filter(a => a.status === 'pending').forEach(a => add('adjust', a.adj_id, { title: `${num(a.amount) < 0 ? 'ลดยอด' : 'เพิ่มยอด'} บ้าน ${a.house_no} ${fmt(Math.abs(num(a.amount)))} บาท`, desc: a.reason, amount: a.amount,\n ง BANK_INFO หรือ QR'),\n      chk(ScriptApp.getProjectTriggers().length > 0, 'ตัวตั้งเวลาอัตโนมัติ', 'รันฟังก์ชัน setup ใน Apps Script'),\n      chk(typeof Drive !== 'undefined', 'ลบรูปถาวรอัตโนมัติ (Advanced Drive Service)', 'Apps Script → Services (+) → Drive API → Add · ถ้าไม่เปิด รูปที่ครบกำหนดจะอยู่ในถังขยะอีก 30 วัน'),\n      ...['Houses', 'Users', 'Invoices', 'Payments', 'Settings'].map(n => { const pr = headerProblems(n); return chk(!pr.length, `หัวคอลัมน์ชีต ${n}`, pr.join(' · ') + ' — แก้ชื่อหัวในแถวที่ 1 ให้ตรง (ลบคอลัมน์ที่ซ้ำ) แล้วรัน setup'); })\n    ], pending: users.filter(x => x.active !== 'TRUE').length, admin_until: prop('ADMIN_UNTIL') || '', line: lineUsage() };\n  }},\n  // กรรมการตรวจการกระทำของผู้ดูแลระบบ\n  featuresView: { roles: ['admin'], fn: () => ({\n    features: Object.keys(FEATURES).map(k => ({ key: k, label: FEATURE_TH[k], on: isTrue(setting(FEATURES[k])), effective: featureOn(k), needs: FEATURE_NEEDS[k] || '', needs_label: FEATURE_NEEDS[k] ? FEATURE_TH[FEATURE_NEEDS[k]] : '' })),\n    core: ['ชำระเงินและใบแจ้งชำระ', 'ระบบอนุมัติของกรรมการ', 'บันทึกการกระทำ', 'หน้าผู้ดูแลระบบ'],\n    advanced_drive: typeof Drive !== 'undefined' }) },\n  saveFeatures: { roles: ['admin'], fn: (u, d) => {\n    const on = d.features || {}, chg = [];\n    Object.keys(FEATURES).forEach(k => {\n      if (on[k] === undefined) return;\n      const nv = on[k] ? 'TRUE' : 'FALSE';\n      if (String(setting(FEATURES[k])) !== nv) { setSettingValue(FEATURES[k], nv); chg.push(`${FEATURE_TH[k]}: ${on[k] ? 'เปิด' : 'ปิด'}`); }\n    });\n    if (chg.length) {\n      audit(u, 'saveFeatures', chg.join(', '));\n      notifyRoles(['committee', 'manager'], `⚙️ ผู้ดูแลระบบเปลี่ยนการเปิด/ปิดฟีเจอร์: ${chg.join(', ')}`, 'normal');\n    }\n    return featureFlags();\n  }},\n\n  adminLog: { roles: ['committee'], fn: () => rows('AuditLog').filter(a => /^ADMIN:/.test(a.action)).reverse().slice(0, 200) },\n\n  setUser: { roles: ['manager'], fn: (u, d) => {\n    const t = findOne('Users', 'line_user_id', d.line_user_id);\n    if (!t) throw new Error('ไม่พบผู้ใช้');\n    if (!ALL_ROLES.includes(d.role)) throw new Error('สิทธิ์ไม่ถูกต้อง');\n    if (!u.isAdmin && (['committee', 'manager'].includes(d.role) || ['committee', 'manager'].includes(t.role)))\n      throw new Error('สิทธิ์กรรมการ/นิติฯ เปลี่ยนได้เฉพาะผ่านคำขอแก้ทะเบียนกรรมการ (อนุมัติโดยกรรมการ + อ้างอิงมติที่ประชุม)');\n    if (eq(d.line_user_id, u.line_user_id) && (d.role !== u.role || !d.active)) throw new Error('แก้สิทธิ์หรือระงับบัญชีของตนเองไม่ได้');\n    const ch = { role: d.role, active: d.active ? 'TRUE' : 'FALSE' };\n    if (u.isAdmin) ch.office = (d.role === 'committee' && d.office) ? 'TRUE' : '';   // ผู้ดูแลระบบตั้งกรรมการ/นิติฯ ได้โดยตรง\n    if (d.house_no !== undefined && d.house_no !== '' && ['resident', 'committee', 'manager'].includes(d.role)) {\n      if (!findOne('Houses', 'house_no', d.house_no)) throw new Error('ไม่พบบ้านเลขที่นี้');\n      ch.house_no = String(d.house_no).trim();\n    }\n    patch('Users', t, ch);\n    if (d.active && t.active !== 'TRUE') pushText(t.line_user_id, '✅ บัญชีของคุณได้รับการยืนยันแล้ว เริ่มใช้งานได้เลย');\n    audit(u, 'setUser', d);\n    return true;\n  }}\n};\n\n/* ======================= API ======================= */\nfunction doGet() { return ContentService.createTextOutput('VillaKunalai 3 API OK'); }\n\nfunction doPost(e) {\n  let out;\n  try {\n    memoOn();\n    const req = JSON.parse(e.postData.contents);\n    const user = authenticate(req.idToken);\n    rateLimit(user);\n    applyPinGate(user);   // กรรมการ/นิติฯ ที่ยังไม่ยืนยัน PIN จะถูกลดสิทธิ์เป็นลูกบ้านชั่วคราว\n    if (user.isAdmin && Object.prototype.hasOwnProperty.call(ADMIN_AS, req.as)) {   // ผู้ดูแลระบบทดสอบหน้าของแต่ละบทบาท\n      if (ADMIN_AS[req.as]) user.role = ADMIN_AS[req.as];\n      if (req.as === 'committee' || req.as === 'office') user.office = 'TRUE';\n    }\n    if (user.isAdmin && req.action !== 'batch' && !BATCH_OK.includes(req.action) && !/^(list|get|view|my|house|qr|report|setting|bank|roster|evidence|vote(Item)?$|sys)/.test(req.action))\n      audit(user, 'ADMIN:' + req.action, { as: req.as || '' });\n    if (req.action === 'batch') {\n      // รวมคำขออ่านหลายรายการในรอบเดียว (ลดเวลารอเครือข่าย) แต่ละรายการตรวจสิทธิ์แยกกัน\n      const calls = Array.isArray((req.data || {}).calls) ? req.data.calls.slice(0, 6) : [];\n      out = { ok: true, data: withLock(() => calls.map(c => {\n        try {\n          if (!c || !BATCH_OK.includes(c.action)) throw new Error('คำสั่งนี้รวมในชุดไม่ได้');\n          return { ok: true, data: runRoute(user, c.action, c.data) };\n        } catch (err) { return { ok: false, error: err.message || String(err) }; }\n      })) };\n    } else {\n      out = { ok: true, data: withLock(() => runRoute(user, req.action, req.data)) };\n    }\n  } catch (err) {\n    out = { ok: false, error: err.message || String(err) };\n  } finally { memoOff(); }\n  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);\n}\n\nconst BATCH_OK = ['me', 'dashboard', 'myAccount', 'myVisits', 'inbox', 'listTasks', 'pendingPayments', 'arrearsList'];   // อ่านอย่างเดียว\nfunction runRoute(user, action, data) {\n  const route = ROUTES[action];\n  if (!route) throw new Error('ไม่รู้จักคำสั่ง ' + action);\n  const need = ROUTE_FEATURE[action];\n  if (need && !featureOn(need)) throw new Error('ฟีเจอร์นี้ถูกปิดใช้งานโดยผู้ดูแลระบบ');\n  if (user.role === 'housekeeper' && !user.isAdmin && !featureOn('housekeeper') && action !== 'me') throw new Error('ระบบแม่บ้านถูกปิดใช้งานโดยผู้ดูแลระบบ');\n  if (user.role === 'guard' && !user.isAdmin && !featureOn('guard') && action !== 'me') throw new Error('ระบบ รปภ. ถูกปิดใช้งานโดยผู้ดูแลระบบ');\n  if (route.roles && !route.roles.some(r => effRoles(user).includes(r)))\n    throw new Error(user.locked && route.roles.some(r => STAFF.includes(r)) ? 'กรุณายืนยัน PIN เพื่อเข้าโหมดกรรมการ/นิติฯ' : 'คุณไม่มีสิทธิ์ใช้งานส่วนนี้');\n  return route.fn(user, data || {});\n}\n\n// ตรวจรูปแบบ ID token เบื้องต้นก่อนถาม LINE: กันคนส่งข้อมูลขยะมาเผาโควตา UrlFetch\nfunction tokenLooksValid(idToken, channelId) {\n  const t = String(idToken);\n  if (t.length > 4096 || !/^[\\w-]+\\.[\\w-]+\\.[\\w-]+$/.test(t)) return false;\n  try {\n    let part = t.split('.')[1]; while (part.length % 4) part += '=';\n    const c = JSON.parse(Utilities.newBlob(Utilities.base64DecodeWebSafe(part)).getDataAsString());\n    const aud = Array.isArray(c.aud) ? c.aud : [c.aud];\n    return c.iss === 'https://access.line.me' && aud.map(String).includes(String(channelId)) && Number(c.exp) > Date.now() / 1000 && /^U[0-9a-f]{32}$|^[\\w-]{1,64}$/.test(String(c.sub || ''));\n  } catch (e) { return false; }\n}\nfunction authenticate(idToken) {\n  if (!idToken) throw new Error('กรุณาเข้าสู่ระบบผ่าน LINE');\n  const channelId = prop('LINE_LOGIN_CHANNEL_ID');\n  if (!channelId) throw new Error('ระบบยังไม่ได้ตั้งค่า LINE_LOGIN_CHANNEL_ID (แจ้งผู้ดูแล)');   // ตั้งค่าไม่ครบ = ปฏิเสธทุกคำขอ\n  const fail = () => new Error('ยืนยันตัวตน LINE ไม่สำเร็จ กรุณาปิดแล้วเปิดแอปใหม่');\n  if (!tokenLooksValid(idToken, channelId)) throw fail();\n  const cache = CacheService.getScriptCache();\n  const key = 'tk_' + Utilities.base64EncodeWebSafe(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, idToken)).slice(0, 40);\n  if (cache.get('bad' + key)) throw fail();                              // token ที่ LINE เพิ่งปฏิเสธ ไม่ถามซ้ำ\n  let p = cache.get(key); p = p ? JSON.parse(p) : null;\n  if (!p) {\n    const res = UrlFetchApp.fetch('https://api.line.me/oauth2/v2.1/verify', {\n      method: 'post', muteHttpExceptions: true,\n      payload: { id_token: idToken, client_id: channelId } });\n    let j = {}; try { j = JSON.parse(res.getContentText()); } catch (e) { }\n    const aud = Array.isArray(j.aud) ? j.aud : [j.aud];\n    if (!j.sub || !aud.map(String).includes(String(channelId))) { cache.put('bad' + key, '1', 600); throw fail(); }   // ต้องออกให้ช่องทางของเราเท่านั้น\n    p = { sub: j.sub, name: j.name || '' };\n    const ttl = Math.min(3000, Math.max(60, Math.floor((Number(j.exp) || 0) - Date.now() / 1000) - 60));\n    cache.put(key, JSON.stringify(p), ttl);   // จำผลยืนยันจนใกล้หมดอายุ token (สูงสุด 50 นาที) ลดการเรียก LINE ซ้ำ\n  }\n  const u = findOne('Users', 'line_user_id', p.sub);\n  if (u && u.active === 'TRUE') return u;     // สิทธิ์อ่านจากชีตฝั่งเซิร์ฟเวอร์เสมอ ไม่เชื่อค่าจากหน้าเว็บ\n  return { line_user_id: p.sub, display_name: p.name || '', role: u ? 'pending' : 'guest', house_no: u ? u.house_no : '' };\n}\n\nfunction rateLimit(u) {\n  const c = CacheService.getScriptCache(), k = 'rl_' + u.line_user_id, n = Number(c.get(k)) || 0;\n  if (n >= 90) throw new Error('ส่งคำขอถี่เกินไป กรุณารอสักครู่แล้วลองใหม่');\n  c.put(k, String(n + 1), 60);\n}\n\nfunction withLock(fn) {\n  const lock = LockService.getScriptLock();\n  lock.waitLock(30000);\n  try { return fn(); } finally { lock.releaseLock(); }\n}\n\n/* ======================= DATA HELPERS ======================= */\nlet _S = null;\n/* แคชภายในคำขอเดียว (เฉพาะใน doPost): อ่านแต่ละชีตครั้งเดียวต่อคำขอ ลดเวลาเรียก Sheets ซ้ำ\n   ล้างทุกครั้งที่เขียนชีตนั้น และไม่ใช้กับงานตั้งเวลา/การรันมือ (ข้อมูลสดเสมอ) */\nlet _MEMO = null;\nfunction memoOn() { _MEMO = { rows: {}, sh: {}, ss: null }; }\nfunction memoOff() { _MEMO = null; }\nfunction memoDrop(name) { if (_MEMO) delete _MEMO.rows[name]; if (name === 'Settings') _S = null; }\nfunction sh(name) {\n  if (!_MEMO) return SpreadsheetApp.getActive().getSheetByName(name);\n  if (!_MEMO.ss) _MEMO.ss = SpreadsheetApp.getActive();\n  return _MEMO.sh[name] || (_MEMO.sh[name] = _MEMO.ss.getSheetByName(name));\n}\n// หมายเหตุ: ชีตแปลงค่าที่พิมพ์ว่า TRUE เป็นบูลีน จึงแปลงกลับเป็นข้อความ 'TRUE'/'FALSE'\nfunction rows(name) {\n  if (_MEMO && _MEMO.rows[name]) return _MEMO.rows[name].map(o => Object.assign({}, o));   // คืนสำเนา กันโค้ดอื่นแก้ของในแคช\n  const v = sh(name).getDataRange().getValues();\n  const h = v.shift();\n  const out = v.map((r, i) => {\n    const o = { _row: i + 2 };\n    h.forEach((k, j) => { o[k] = r[j] instanceof Date ? Utilities.formatDate(r[j], TZ, \"yyyy-MM-dd'T'HH:mm:ss\") : (typeof r[j] === 'boolean' ? (r[j] ? 'TRUE' : 'FALSE') : String(r[j])); });\n    return o;\n  });\n  if (_MEMO) { _MEMO.rows[name] = out; return out.map(o => Object.assign({}, o)); }\n  return out;\n}\n// อ่าน/เขียนตาม \"ชื่อหัวคอลัมน์\" ในชีตจริง (ลำดับคอลัมน์ในชีตไม่ต้องตรงกับ SCHEMA) · คอลัมน์ที่ขาดเพิ่มให้ท้ายตาราง\nfunction headOf(name) {\n  if (_MEMO && _MEMO.head && _MEMO.head[name]) return _MEMO.head[name];\n  const s = sh(name), h = s.getRange(1, 1, 1, Math.max(1, s.getLastColumn())).getValues()[0].map(x => String(x).trim());\n  if (_MEMO) { _MEMO.head = _MEMO.head || {}; _MEMO.head[name] = h; }\n  return h;\n}\nfunction colOf(name, k) {\n  const h = headOf(name); let c = h.indexOf(k);\n  if (c < 0) {\n    if (!SCHEMA[name].includes(k)) throw new Error('ไม่มีคอลัมน์ ' + k);\n    c = h.length; sh(name).getRange(1, c + 1).setValue(k); h.push(k);\n  }\n  return c;\n}\n// ตรวจหัวคอลัมน์: ขาด / ซ้ำ (ซ้ำทำให้อ่านกับเขียนคนละช่อง)\nfunction headerProblems(name) {\n  let h; try { h = headOf(name); } catch (e) { return ['ไม่พบชีต ' + name]; }\n  const miss = SCHEMA[name].filter(k => !h.includes(k)), dup = h.filter((k, i) => k && h.indexOf(k) !== i);\n  return [].concat(miss.length ? ['ขาด: ' + miss.join(', ')] : [], dup.length ? ['ซ้ำ: ' + [...new Set(dup)].join(', ')] : []);\n}\nfunction insert(name, obj) {\n  memoDrop(name);\n  SCHEMA[name].forEach(k => { if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') colOf(name, k); });\n  sh(name).appendRow(headOf(name).map(k => (!k || obj[k] === undefined || obj[k] === null) ? '' : String(obj[k])));\n}\nfunction patch(name, rowObj, changes) {\n  memoDrop(name);\n  Object.keys(changes).forEach(k => {\n    const c = colOf(name, k);\n    sh(name).getRange(rowObj._row, c + 1).setValue(String(changes[k]));\n  });\n}\nfunction findOne(name, key, val) { return rows(name).find(r => eq(r[key], val)); }\nfunction eq(a, b) { return String(a).trim() === String(b).trim(); }\nfunction num(x) { return Number(x) || 0; }\nfunction dayDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }\nfunction round2(x) { return Math.round(num(x) * 100) / 100; }\nfunction sum(arr, f) { return arr.reduce((s, x) => s + num(f(x)), 0); }\nfunction outstanding(i) { return round2(num(i.amount) - num(i.paid)); }\nfunction fmt(n) { return num(n).toFixed(2).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ','); }\nfunction pad2(n) { return String(n).padStart(2, '0'); }\nfunction now() { return Utilities.formatDate(new Date(), TZ, \"yyyy-MM-dd'T'HH:mm:ss\"); }\nfunction today() { return Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd'); }\nfunction ym(d) { return Utilities.formatDate(d, TZ, 'yyyy-MM'); }\nfunction uid(p) { return p + '-' + Utilities.formatDate(new Date(), TZ, 'yyMMddHHmmss') + '-' + Utilities.getUuid().slice(0, 4); }\nfunction prop(k) { return PropertiesService.getScriptProperties().getProperty(k); }\nfunction setting(k) {\n  if (!_S) { _S = {}; rows('Settings').forEach(r => { _S[r.key] = r.value; }); }\n  return (_S[k] !== undefined && _S[k] !== '') ? _S[k] : DEFAULT_SETTINGS[k];\n}\nfunction lastMonths(n) {\n  const out = [], d = new Date();\n  for (let k = n - 1; k >= 0; k--) out.push(ym(new Date(d.getFullYear(), d.getMonth() - k, 1)));\n  return out;\n}\nfunction audit(u, action, detail) {\n  u = u || { display_name: 'ระบบ', house_no: '', role: 'system' };\n  insert('AuditLog', { time: now(), user: `${u.display_name} (${u.house_no || '-'})`, role: u.realRole || u.role,\n    action, detail: JSON.stringify(detail).slice(0, 500) });\n}\nconst OK_MIME = /^(image\\/(jpeg|png|webp|heic|heif)|application\\/pdf)$/;\nfunction saveFile(b64, mime, name, isPublic) {\n  if (!b64) return '';\n  mime = mime || 'image/jpeg';\n  if (!OK_MIME.test(mime)) throw new Error('ชนิดไฟล์ไม่รองรับ (รับเฉพาะรูปภาพและ PDF)');\n  if (String(b64).length > 8e6) throw new Error('ไฟล์ใหญ่เกินไป (สูงสุดประมาณ 6 MB)');\n  const folder = DriveApp.getFolderById(setting('DRIVE_FOLDER_ID'));\n  const f = folder.createFile(Utilities.newBlob(Utilities.base64Decode(b64), mime, String(name).replace(/[^\\w.-]/g, '_')));\n  if (isPublic) f.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);\n  return f.getId();\n}\n\n/* ======================= ค่าส่วนกลาง ======================= */\nfunction account(house) {\n  const h = findOne('Houses', 'house_no', house) || {};\n  const t = today();\n  const inv = rows('Invoices').filter(i => eq(i.house_no, house) && i.status !== 'void').reverse();\n  const open = inv.filter(i => OPEN.includes(i.status));\n  return {\n    house: { house_no: house, owner_name: h.owner_name || '', plan: PLANS.includes(h.plan) ? h.plan : 'monthly',\n             area_sqw: h.area_sqw || '', credit: num(h.credit) },\n    current: round2(sum(open.filter(i => i.due_date >= t), outstanding)),\n    arrears: round2(sum(open.filter(i => i.due_date < t), outstanding)),\n    invoices: inv,\n    payments: rows('Payments').filter(p => eq(p.house_no, house)).reverse(),\n    ledger: buildLedger(inv, rows('Payments').filter(p => eq(p.house_no, house)))\n  };\n}\n\n// สมุดบัญชีรายบ้าน: เดบิต = บิล, เครดิต = เงินที่ยืนยันรับแล้ว  (คงเหลือ + = ค้างชำระ, − = จ่ายล่วงหน้า)\nfunction buildLedger(invs, pays) {\n  const ev = [];\n  invs.forEach(i => ev.push({ date: String(i.created_at).slice(0, 10), kind: 'bill', debit: num(i.amount), credit: 0,\n    label: `บิล งวด ${i.period}` + (num(i.adjust) ? ` (ปรับ ${num(i.adjust) > 0 ? '+' : ''}${fmt(i.adjust)})` : '') }));\n  pays.filter(p => p.status === 'verified').forEach(p => ev.push({ date: p.paid_on || String(p.verified_at).slice(0, 10), kind: 'pay', debit: 0, credit: num(p.amount),\n    label: `ชำระ ${p.receipt_no || ''}${p.ref_no ? ' อ้างอิง ' + p.ref_no : ''}` }));\n  ev.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.kind === 'bill' ? -1 : 1));\n  let bal = 0; ev.forEach(e => { bal = round2(bal + e.debit - e.credit); e.balance = bal; });\n  return ev;\n}\n\nfunction allocate(house, amount, refDate) {\n  const t = refDate || today();\n  rows('Invoices').filter(i => eq(i.house_no, house) && OPEN.includes(i.status) && (i.plan === 'half' || i.plan === 'yearly')\n      && num(i.discount) > 0 && i.discount_lost !== 'TRUE' && i.due_date < t)\n    .forEach(i => recalcInvoice(i, { discount: monthlyDiscountOf(i), discount_lost: 'TRUE' }));\n  rows('Invoices').filter(i => eq(i.house_no, house) && OPEN.includes(i.status) && (i.plan === 'half' || i.plan === 'yearly')\n      && i.discount_lost === 'TRUE' && num(i.discount_pct) > 0 && i.due_date >= t)\n    .forEach(i => recalcInvoice(i, { discount: round2(num(i.gross) * num(i.discount_pct) / 100), discount_lost: 'FALSE' }));\n  const open = rows('Invoices').filter(i => eq(i.house_no, house) && OPEN.includes(i.status));\n  const byDue = (a, b) => a.due_date < b.due_date ? -1 : a.due_date > b.due_date ? 1 : 0;\n  const cur = open.filter(i => i.due_date >= t).sort(byDue);\n  const old = open.filter(i => i.due_date < t).sort(byDue);\n  if (setting('ARREARS_ORDER') === 'newest') old.reverse();\n  let left = round2(amount);\n  const alloc = [];\n  cur.concat(old).forEach(i => {\n    if (left <= 0) return;\n    const due = outstanding(i);\n    if (due <= 0) return;\n    const take = round2(Math.min(left, due));\n    const paid = round2(num(i.paid) + take);\n    patch('Invoices', i, { paid, status: paid >= num(i.amount) ? 'paid' : 'partial' });\n    alloc.push({ invoice_id: i.invoice_id, period: i.period, amount: take });\n    left = round2(left - take);\n  });\n  return { alloc, left };\n}\n\nfunction addCredit(house, amt) {\n  const h = findOne('Houses', 'house_no', house);\n  if (h) patch('Houses', h, { credit: round2(num(h.credit) + amt) });\n}\n\nconst OPEN_ARREARS = 'ค้างยกมา', OPEN_PREPAID = 'ชำระล่วงหน้ายกมา';\nfunction openingGuard(u) { if (isTrue(setting('OPENING_LOCKED')) && !u.isAdmin) throw new Error('ข้อมูลยกมาถูกล็อกแล้ว ต้องขอปลดล็อก (ตั้งค่า \"ล็อกข้อมูลยกมา\") ผ่านการอนุมัติกรรมการ'); }\n// \"จ่ายล่วงหน้าถึง\": yyyy-mm (ค.ศ. หรือ พ.ศ.), หรือ H1 / H2 / Y (= มิ.ย. / ธ.ค. ของปีที่เริ่มระบบ), เว้นว่าง = ไม่มี\nfunction parsePaidUntil(v, startMonth) {\n  let x = String(v === undefined || v === null ? '' : v).trim().toUpperCase().replace(/\\//g, '-');\n  if (!x || x === '-') return '';\n  const y = Number(startMonth.slice(0, 4));\n  if (/^(H1|1-6|ม\\.?ค\\.?-มิ\\.?ย\\.?)$/.test(x)) x = y + '-06';\n  else if (/^(H2|7-12|ก\\.?ค\\.?-ธ\\.?ค\\.?|Y|YEAR|ปี|รายปี|1-12)$/.test(x)) x = y + '-12';\n  const m = /^(\\d{4})-(\\d{1,2})$/.exec(x); if (!m) throw new Error('จ่ายล่วงหน้าถึง ต้องเป็น yyyy-mm หรือ H1 / H2 / Y');\n  let yy = Number(m[1]); if (yy > 2400) yy -= 543;\n  const mm = Number(m[2]); if (mm < 1 || mm > 12) throw new Error('เดือนไม่ถูกต้อง');\n  const r = yy + '-' + pad2(mm);\n  return r < startMonth ? '' : r;   // จ่ายถึงก่อนเดือนที่เริ่มระบบ = ไม่มีส่วนล่วงหน้า\n}\nfunction ensureColumns(name) {   // เพิ่มคอลัมน์ใหม่ให้ชีตเดิมอัตโนมัติ (ไม่ต้องรัน setup ซ้ำ)\n  const s = sh(name); if (!s) return;\n  const head = s.getRange(1, 1, 1, Math.max(1, s.getLastColumn())).getValues()[0].map(String);\n  SCHEMA[name].forEach(k => { if (!head.includes(k)) { s.getRange(1, head.length + 1).setValue(k); head.push(k); } });\n}\nfunction ensureSheet(name) {   // สร้างชีตใหม่ให้อัตโนมัติ (ไม่ต้องรัน setup ซ้ำ)\n  const ss = SpreadsheetApp.getActive(); if (ss.getSheetByName(name)) return;\n  const s = ss.insertSheet(name); s.getRange('A:Z').setNumberFormat('@'); s.appendRow(SCHEMA[name]); s.setFrozenRows(1);\n  if (typeof _MEMO !== 'undefined' && _MEMO) delete _MEMO.sh[name];\n}\n// แพ็กเกจที่จ่ายไม่ทันกำหนด: คิดเท่าการจ่ายรายเดือน (ส่วนลดรายเดือนจากราคาเต็ม)\nconst CARD_CUT_TEXT = h => `⛔ แจ้งระงับบัตรเข้า-ออก บ้านเลขที่ ${h}\\n` +\n  `ตามระเบียบหมู่บ้าน บ้านที่ค้างชำระค่าส่วนกลางเกิน ${setting('ARREARS_ALERT_MONTHS')} เดือน จะถูกตัดบัตรเข้า-ออก\\n` +\n  `‼️ ไม้กั้นจะไม่เปิดให้อัตโนมัติ ต้องลงจากรถมากดปุ่มเองที่ห้อง รปภ.\\n‼️ รปภ.ไม่กดให้ หรือต้องแลกบัตรที่ป้อม รปภ.`;\n// เดือนที่ค้าง = บิลรายเดือนที่เลยกำหนด + ยอดค้างอื่น (เช่น ค้างยกมา) เทียบเป็นเดือนตามค่าส่วนกลางรายเดือนของบ้าน\nfunction arrearsInfo(house) {\n  const h = findOne('Houses', 'house_no', house) || {}, t = today();\n  const unit = round2(num(h.area_sqw) * num(setting('RATE_PER_SQW')) * (1 - num(setting('DISCOUNT_MONTH_PCT')) / 100));\n  const over = rows('Invoices').filter(i => eq(i.house_no, house) && OPEN.includes(i.status) && i.due_date < t && outstanding(i) > 0);\n  const monthly = over.filter(i => i.plan === 'monthly' && i.cover_from && i.cover_from === i.cover_to);\n  const other = round2(sum(over.filter(i => !monthly.includes(i)), outstanding));\n  const months = monthly.length + (unit > 0 ? Math.floor(other / unit + 1e-6) : 0), limit = num(setting('ARREARS_ALERT_MONTHS')) || 3;\n  return { months, amount: round2(sum(over, outstanding)), limit, over: months > limit };\n}\nfunction checkArrears(onlyHouse) {   // ทุกวัน + หลังยืนยันการชำระ: แจ้งครั้งแรกเมื่อเกินเกณฑ์ ย้ำทุก 7 วัน · ชำระแล้วแจ้งปลด\n  const t = today(), added = [], cleared = [];\n  rows('Houses').filter(h => h.house_no && (!onlyHouse || eq(h.house_no, onlyHouse))).forEach(h => {\n    const a = arrearsInfo(h.house_no);\n    if (a.over) {\n      const first = !h.arrears_alert, again = !first && (!h.arrears_notice_at || addDays(h.arrears_notice_at, 7) <= t);\n      if (first || again) {\n        notifyHouse(h.house_no, CARD_CUT_TEXT(h.house_no) + `\\n\\nยอดค้าง ${a.months} เดือน รวม ${fmt(a.amount)} บาท\\nชำระแล้วระบบแจ้งเปิดบัตรให้อัตโนมัติ`, null, first ? 'critical' : 'normal');\n        patch('Houses', h, first ? { arrears_alert: t, arrears_notice_at: t } : { arrears_notice_at: t });\n        if (first) added.push(`${h.house_no} (${a.months} เดือน ${fmt(a.amount)} บาท)`);\n      }\n    } else if (h.arrears_alert) {\n      patch('Houses', h, { arrears_alert: '', arrears_notice_at: '' });\n      notifyHouse(h.house_no, `✅ บ้านเลขที่ ${h.house_no} ค้างชำระไม่เกินเกณฑ์แล้ว นิติฯ จะเปิดใช้บัตรเข้า-ออกให้`, null, 'critical');\n      cleared.push(h.house_no);\n    }\n  });\n  if (added.length) notifyRoles(['committee', 'manager'], `⛔ บ้านค้างชำระเกิน ${setting('ARREARS_ALERT_MONTHS')} เดือน (แจ้งตัดบัตรแล้ว):\\n${added.join('\\n')}\\nนิติฯ: ระงับบัตรในระบบไม้กั้น และแจ้ง รปภ.`, 'normal');\n  if (cleared.length) notifyRoles(['manager'], `✅ ชำระแล้ว ให้เปิดบัตรเข้า-ออก: บ้าน ${cleared.join(', ')}`, 'normal');\n  return { added: added.length, cleared: cleared.length };\n}\nfunction monthlyDiscountOf(i) { return round2(num(i.gross) * num(setting('DISCOUNT_MONTH_PCT')) / 100); }\nfunction applyCredit(house) {\n  const h = findOne('Houses', 'house_no', house);\n  if (!h) return;\n  const c = num(h.credit);\n  if (c <= 0) return;\n  const r = allocate(house, c);\n  patch('Houses', h, { credit: r.left });\n  if (r.alloc.length) insert('Payments', { pay_id: uid('CRD'), house_no: house, amount: round2(c - r.left),\n    note: 'หักจากเครดิตคงเหลือ', status: 'credit_applied', submitted_at: now(), verified_at: now(),\n    verified_by: 'ระบบ', allocation: JSON.stringify(r.alloc) });\n}\n\nfunction billSpec(plan, y, m) {\n  if (plan === 'monthly') return { period: `${y}-${pad2(m)}`, from: m, to: m, pct: num(setting('DISCOUNT_MONTH_PCT')) };   // ลดทั้งหมู่บ้าน ไม่หายเมื่อจ่ายช้า (ตัดสิทธิ์เฉพาะแพ็กเกจ)\n  if (plan === 'half') {\n    if (m === num(setting('HALF1_DUE_MONTH'))) return { period: `${y}-H1`, from: 1, to: 6, pct: num(setting('DISCOUNT_HALF_PCT')) };\n    if (m === num(setting('HALF2_DUE_MONTH'))) return { period: `${y}-H2`, from: 7, to: 12, pct: num(setting('DISCOUNT_HALF_PCT')) };\n  }\n  if (plan === 'yearly' && m === num(setting('YEAR_DUE_MONTH')))\n    return { period: `${y}`, from: 1, to: 12, pct: num(setting('DISCOUNT_YEAR_PCT')) };\n  return null;\n}\n\nfunction generateInvoices(d) {\n  const y = d.getFullYear(), m = d.getMonth() + 1, rate = num(setting('RATE_PER_SQW'));\n  const due = Utilities.formatDate(new Date(y, m, 0), TZ, 'yyyy-MM-dd');\n  const all = rows('Invoices').filter(i => i.status !== 'void');\n  const skipped = [];\n  let made = 0;\n  rows('Houses').forEach(h => {\n    if (!h.house_no) return;\n    const plan = 'monthly';   // v4: ทุกบ้านมีบิลรายเดือนเสมอ ราย 6 เดือน/รายปีเป็นแพ็กเกจที่ลูกบ้านเลือกซื้อในช่วงที่เปิด\n    const s = billSpec(plan, y, m);\n    if (!s) return;\n    const id = `INV-${s.period}-${h.house_no}`;\n    const from = `${y}-${pad2(s.from)}`, to = `${y}-${pad2(s.to)}`;\n    const overlap = all.some(i => eq(i.house_no, h.house_no) && i.cover_from && i.cover_from <= to && i.cover_to >= from);\n    if (overlap) { if (!all.some(i => i.invoice_id === id)) skipped.push(h.house_no); return; }\n    const area = num(h.area_sqw);\n    if (!area || !rate) { skipped.push(h.house_no); return; }\n    const months = s.to - s.from + 1;\n    const gross = round2(area * rate * months), discount = round2(gross * s.pct / 100), amount = round2(gross - discount);\n    insert('Invoices', { invoice_id: id, house_no: h.house_no, period: s.period, plan, cover_from: from, cover_to: to,\n      months, area_sqw: area, rate, gross, discount_pct: s.pct, discount, adjust: 0, amount, paid: 0,\n      due_date: due, status: 'unpaid', created_at: now(), discount_lost: 'FALSE' });\n    made++;\n    applyCredit(h.house_no);\n    const inv = findOne('Invoices', 'invoice_id', id);\n    notifyHouse(h.house_no, `🧾 ค่าส่วนกลาง${PLAN_TH[plan]} งวด ${s.period}\\n` +\n      `${area} ตร.ว. × ${fmt(rate)} บาท × ${months} เดือน = ${fmt(gross)} บาท` +\n      (discount ? `\\nส่วนลด ${s.pct}% -${fmt(discount)} บาท (ชำระภายใน ${due})` : '') +\n      `\\nยอดบิล ${fmt(amount)} บาท` + (num(inv.paid) ? `\\nหักเครดิตแล้ว ${fmt(inv.paid)} บาท` : '') +\n      `\\nครบกำหนด ${due}\\n${setting('BANK_INFO')}`);\n  });\n  if (skipped.length) notifyRoles(['manager'], `⚠️ ออกบิลอัตโนมัติไม่ได้ บ้านเลขที่: ${skipped.join(', ')}`);\n  return made;\n}\n\nfunction makeReceipt(house, receiptNo, amount, r, receiver) {\n  const tpl = setting('RECEIPT_TEMPLATE_DOC_ID');\n  if (!tpl) return makeSimpleReceipt(house, receiptNo, amount, r, receiver);\n  const h = findOne('Houses', 'house_no', house) || {};\n  const folder = DriveApp.getFolderById(setting('DRIVE_FOLDER_ID'));\n  const copy = DriveApp.getFileById(tpl).makeCopy('tmp-' + receiptNo, folder);\n  const doc = DocumentApp.openById(copy.getId()), body = doc.getBody();\n  const lines = r.alloc.length ? r.alloc.map(a => `ค่าส่วนกลาง งวด ${a.period}     ${fmt(a.amount)} บาท`) : ['ชำระล่วงหน้า'];\n  if (r.left > 0) lines.push(`เก็บเป็นเครดิตสำหรับงวดถัดไป     ${fmt(r.left)} บาท`);\n  const found = body.findText('\\\\{\\\\{items\\\\}\\\\}');\n  if (found) {\n    const p = found.getElement().getParent();\n    const idx = body.getChildIndex(p);\n    p.asParagraph().setText(lines[0]);\n    for (let k = lines.length - 1; k >= 1; k--) body.insertParagraph(idx + 1, lines[k]);\n  }\n  const map = { village: setting('VILLAGE_NAME'), receipt_no: receiptNo, house_no: house, owner: h.owner_name || '',\n    paid_date: today(), total: fmt(amount), verified_by: receiver };\n  Object.keys(map).forEach(k => body.replaceText('\\\\{\\\\{' + k + '\\\\}\\\\}', String(map[k])));\n  doc.saveAndClose();\n  const pdf = folder.createFile(copy.getAs('application/pdf')).setName(receiptNo + '.pdf');\n  copy.setTrashed(true);   // ใบเสร็จเป็นไฟล์ส่วนตัว เปิดผ่านระบบ (getFile) เท่านั้น\n  return pdf.getId();\n}\n\nfunction makeSimpleReceipt(house, receiptNo, amount, r, receiver) {\n  const h = findOne('Houses', 'house_no', house) || {};\n  const esc = x => String(x == null ? '' : x).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n  const rowsHtml = r.alloc.map(a => `<tr><td>ค่าส่วนกลาง งวด ${esc(a.period)}</td><td align=\"right\">${fmt(a.amount)}</td></tr>`).join('') +\n    (r.left > 0 ? `<tr><td>เก็บเป็นเครดิตสำหรับงวดถัดไป</td><td align=\"right\">${fmt(r.left)}</td></tr>` : '');\n  const html = `<html><body style=\"font-family:Tahoma,sans-serif\"><h2>ใบเสร็จรับเงิน</h2><h3>${esc(setting('VILLAGE_NAME'))} (นิติบุคคลหมู่บ้านจัดสรร)</h3>\n    <p>เลขที่: <b>${receiptNo}</b> &nbsp; วันที่: ${today()}<br>ได้รับเงินจาก: ${esc(h.owner_name)} &nbsp; บ้านเลขที่: ${esc(house)}</p>\n    <table border=\"1\" cellpadding=\"6\" style=\"border-collapse:collapse;width:100%\"><tr><th align=\"left\">รายการ</th><th align=\"right\">บาท</th></tr>${rowsHtml}\n    <tr><td><b>รวมรับเงินทั้งสิ้น</b></td><td align=\"right\"><b>${fmt(amount)}</b></td></tr></table>\n    <p>ผู้รับเงิน: ${esc(receiver)}</p></body></html>`;\n  const pdf = Utilities.newBlob(html, 'text/html', 'r.html').getAs('application/pdf').setName(receiptNo + '.pdf');\n  return DriveApp.getFolderById(setting('DRIVE_FOLDER_ID')).createFile(pdf).getId();\n}\n\nfunction nextReceiptNo() {\n  const y = Utilities.formatDate(new Date(), TZ, 'yyyy');\n  const p = PropertiesService.getScriptProperties();\n  const n = num(p.getProperty('RC_' + y)) + 1;\n  p.setProperty('RC_' + y, String(n));\n  return `RC${y}-${String(n).padStart(4, '0')}`;\n}\n\n/* ======================= รายจ่าย ======================= */\nfunction pettyUsed(month) {\n  return sum(rows('Expenses').filter(e => e.source === 'petty' && e.paid_at.startsWith(month)), e => e.amount);\n}\n\nfunction decideOne(u, e, approve, reason, quiet, res) {\n  if (!e || e.status !== 'pending') throw new Error('รายการนี้ไม่อยู่ในสถานะรออนุมัติ');\n  const ap = JSON.parse(e.approvals || '[]'), item = { requester: e.requested_by, houses: [], ap, need: num(setting('APPROVALS_REQUIRED')) };\n  if (!approve) {\n    const b = voteBasic(u, item); if (!b.ok) throw new Error(b.why);\n    patch('Expenses', e, { status: 'rejected', note: `ไม่อนุมัติโดย ${u.display_name}: ${reason || '-'}` });\n    notifyRoles(['manager'], `❌ ไม่อนุมัติเบิกจ่าย ${e.category} ${fmt(e.amount)} บาท\\nเหตุผล: ${reason || '-'}`);\n    return null;\n  }\n  const st = needVote(u, item, res);\n  ap.push(vEntry(u, st, res));\n  const ch = { approvals: JSON.stringify(ap) };\n  let msg = null;\n  if (ap.length >= st.need) {\n    ch.status = 'approved';\n    msg = `• ${e.category} ${e.for_period || ''} ${fmt(e.amount)} บาท`;\n    if (!quiet) notifyRoles(['manager'], `✅ อนุมัติครบแล้ว: ${e.category} ${fmt(e.amount)} บาท\\nดำเนินการจ่ายเงินได้`);\n  }\n  patch('Expenses', e, ch);\n  return msg;\n}\n\nfunction generateRecurring(d) {\n  const exp = rows('Expenses'), made = [];\n  rows('Recurring').filter(r => r.active === 'TRUE').forEach(r => {\n    const n = Math.max(1, Math.min(12, parseInt(r.months_ahead, 10) || 1));\n    for (let k = 0; k < n; k++) {\n      const p = ym(new Date(d.getFullYear(), d.getMonth() + k, 1));\n      if (exp.some(e => e.rec_id === r.rec_id && e.for_period === p)) continue;\n      insert('Expenses', { exp_id: uid('EXP'), category: r.category, description: `${r.description || r.category} งวด ${p}`,\n        amount: r.amount, vendor: r.vendor, for_period: p, source: 'recurring', rec_id: r.rec_id,\n        requested_by: 'SYSTEM', requested_name: 'ระบบ (ค่าใช้จ่ายประจำ)', requested_at: now(), status: 'pending', approvals: '[]' });\n      made.push(`• ${r.category} ${p}: ${fmt(r.amount)} บาท`);\n    }\n  });\n  if (made.length) notifyRoles(['committee'], `🔁 ระบบสร้างรายการขอเบิกค่าใช้จ่ายประจำ ${made.length} รายการ รออนุมัติ\\n` + made.slice(0, 15).join('\\n'));\n  return made.length;\n}\n\n/* ======================= บทบาท / PIN / การลงมติ ======================= */\nconst isTrue = v => String(v).toUpperCase() === 'TRUE';\nconst isOffice = u => u.role === 'manager' || (u.role === 'committee' && isTrue(u.office));\nconst effRoles = u => u.isAdmin ? ['resident', 'committee', 'manager', 'guard', 'technician', 'housekeeper', 'admin'] : (u.role === 'committee' && isTrue(u.office)) ? ['committee', 'manager'] : [u.role];\nconst matchRole = (u, r) => r === 'manager' ? isOffice(u) : u.role === r;\nconst WEAK_PINS = ['000000', '111111', '222222', '333333', '444444', '555555', '666666', '777777', '888888', '999999', '123456', '654321', '012345', '123123', '121212'];\nfunction hashPin(pin, salt) {\n  let h = pin + ':' + salt;\n  for (let i = 0; i < 300; i++) h = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, h).map(x => ('0' + (x & 255).toString(16)).slice(-2)).join('');\n  return h;\n}\n/* ---- ผู้ดูแลระบบ (admin) ----\n   กำหนดได้ทางเดียว: Script Properties → ADMIN_LINE_IDS (LINE user id คั่นด้วย ,) โดยเจ้าของ Apps Script เท่านั้น\n   ตั้งวันหมดสิทธิ์ได้ที่ ADMIN_UNTIL (yyyy-mm-dd) · ต้องยืนยัน PIN · ข้ามขั้นตอนอนุมัติได้ แต่ทุกการกระทำถูกบันทึก (ADMIN) ให้กรรมการตรวจ */\nfunction isAdminId(uid) {\n  const ids = String(prop('ADMIN_LINE_IDS') || '').split(/[\\s,]+/).filter(Boolean), until = String(prop('ADMIN_UNTIL') || '').trim();\n  if (until && /^\\d{4}-\\d{2}-\\d{2}$/.test(until) && today() > until) return false;\n  return ids.includes(String(uid));\n}\nconst ADMIN_AS = { resident: null, committee: 'committee', office: 'committee', guard: 'guard', tech: 'technician', housekeeper: 'housekeeper' };\nfunction applyPinGate(u) {\n  u.realRole = u.role; u.officeReal = isTrue(u.office); u.hasPin = !!u.pin_hash; u.pinOK = false; u.locked = false;\n  u.isAdminReal = u.active === 'TRUE' && isAdminId(u.line_user_id); u.isAdmin = false;\n  if (u.isAdminReal) {\n    u.pinOK = !!CacheService.getScriptCache().get('pin_' + u.line_user_id);\n    u.isAdmin = u.pinOK;\n    if (!u.pinOK && STAFF.includes(u.role)) { u.role = 'resident'; u.office = 'FALSE'; u.locked = true; }\n    return u;\n  }\n  if (STAFF.includes(u.role)) {\n    u.pinOK = !!CacheService.getScriptCache().get('pin_' + u.line_user_id);\n    if (!u.pinOK) { u.role = 'resident'; u.office = 'FALSE'; u.locked = true; }\n  }\n  return u;\n}\nfunction pinAttempt(u, ok) {\n  const c = CacheService.getScriptCache(), k = 'pinfail_' + u.line_user_id, n = Number(c.get(k)) || 0;\n  if (ok) { c.remove(k); return; }\n  c.put(k, String(n + 1), 900);\n  if (n + 1 >= 5) audit(u, 'PIN_LOCKED', {});\n}\nconst pinLocked = u => (Number(CacheService.getScriptCache().get('pinfail_' + u.line_user_id)) || 0) >= 5;\nfunction removeRow(name, rowObj) { memoDrop(name); sh(name).deleteRow(rowObj._row); }\nfunction publicUser(r) { const o = Object.assign({}, r); delete o.pin_hash; delete o.pin_salt; delete o._row; return o; }\n\nfunction committeeUsers() {   // กรรมการที่ใช้งานได้และอยู่ในวาระ\n  const roster = rows('Committee'), t = today();\n  return activeUsers().filter(c => c.role === 'committee').filter(c => {\n    const r = roster.find(x => x.uid === c.line_user_id);\n    return !r || ((!r.term_start || r.term_start <= t) && (!r.term_end || r.term_end >= t) && !r.note);\n  });\n}\nfunction voteRule(item) {   // ผู้ขอ + กรรมการที่เป็นเจ้าของบ้านในรายการ ลงมติไม่ได้ ถ้าเหลือไม่ถึงเกณฑ์ ใช้เกณฑ์สำรอง (ต้องอ้างอิงมติที่ประชุม)\n  const elig = committeeUsers().filter(c => c.line_user_id !== item.requester && !(item.houses || []).some(h => h && eq(h, c.house_no)));\n  const base = Math.max(1, Math.floor(num(item.need) || 1)), fallback = elig.length < base;\n  return { eligible: elig, need: fallback ? elig.length : base, fallback };\n}\nfunction voteBasic(u, item) {\n  if (u.isAdmin) return (item.ap || []).some(a => a.id === u.line_user_id) ? { ok: false, why: 'คุณลงมติแล้ว' } : { ok: true, admin: true };   // ผู้ดูแลระบบ: ข้ามเงื่อนไขผู้ขอ/ผลประโยชน์ทับซ้อน\n  if (u.role !== 'committee') return { ok: false, why: 'เฉพาะกรรมการ (ต้องยืนยัน PIN)' };\n  if (item.requester === u.line_user_id) return { ok: false, why: 'คุณเป็นผู้ขอ อนุมัติรายการของตนเองไม่ได้' };\n  if ((item.houses || []).some(h => h && eq(h, u.house_no))) return { ok: false, why: `บ้าน ${u.house_no} เกี่ยวข้องกับรายการนี้ ลงมติไม่ได้ (ผลประโยชน์ทับซ้อน)` };\n  if ((item.ap || []).some(a => a.id === u.line_user_id)) return { ok: false, why: 'คุณลงมติแล้ว' };\n  return { ok: true };\n}\nfunction resolutionOk(res) { const m = จากระบบรุ่นเก่า ไม่ใช้แล้ว\n// คำอธิบายภาษาไทยในคอลัมน์ note ของชีต Settings (เติมเฉพาะช่องว่าง · ค่าที่ไม่ใช้แล้วถูกระบุไว้)\nfunction fillSettingNotes() {\n  const how = k => SETTING_RULES[k] ? ' [เปลี่ยนผ่านการอนุมัติ: โหมดกรรมการ → ตั้งค่า]' : (typeof SIMPLE_RULES !== 'undefined' && SIMPLE_RULES[k]) ? ' [นิติฯ ตั้งในแอป: ตั้งค่าทั่วไป]' : '';\n  let n = 0;\n  rows('Settings').forEach(r => {\n    const want = OBSOLETE_SETTINGS.includes(r.key) ? 'ไม่ใช้แล้ว (ค่าจากระบบรุ่นเก่า) ลบแถวนี้ได้' : SETTING_NOTES[r.key] ? SETTING_NOTES[r.key] + how(r.key) : '';\n    if (want && (!r.note || OBSOLETE_SETTINGS.includes(r.key)) && r.note !== want) { patch('Settings', r, { note: want }); n++; }\n  });\n  return n;\n}\nfunction setSettingValue(key, value) {\n  const r = findOne('Settings', 'key', key);\n  if (r) patch('Settings', r, { value }); else insert('Settings', { key, value });\n  _S = null;\n}\n\n/* ---- PromptPay / EMVCo ---- */\nfunction crc16(str) { let c = 0xFFFF; for (let i = 0; i < str.length; i++) { c ^= str.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return ('0000' + c.toString(16).toUpperCase()).slice(-4); }\nfunction tlvParse(s) {\n  const out = []; let i = 0;\n  while (i < s.length) {\n    const t = s.substr(i, 2), l = parseInt(s.substr(i + 2, 2), 10);\n    if (!/^\\d{2}$/.test(t) || isNaN(l) || !/^\\d{2}$/.test(s.substr(i + 2, 2))) return null;\n    const v = s.substr(i + 4, l); if (v.length !== l) return null;\n    out.push({ t, v }); i += 4 + l;\n  }\n  return out;\n}\nfunction ppInfo(payload) {\n  const p = String(payload || '').trim(), tl = tlvParse(p);\n  if (!tl || p.length < 30 || p.length > 400) return { ok: false, why: 'รูปแบบ QR ไม่ใช่ PromptPay/EMVCo' };\n  if (crc16(p.slice(0, -4)) !== p.slice(-4)) return { ok: false, why: 'รหัสตรวจสอบ (CRC) ของ QR ไม่ถูกต้อง' };\n  const g = t => (tl.find(x => x.t === t) || {}).v;\n  if (g('00') !== '01') return { ok: false, why: 'ไม่ใช่ + suffix 2 หลัก ตามที่ธนาคารให้)');\n  const nm = String(name || '').toUpperCase().replace(/[^A-Z0-9 .&-]/g, '').trim().slice(0, 25);\n  const s = tlv('00', '01') + tlv('01', '12') + tlv('30', tlv('00', BILL_AID) + tlv('01', b) + tlv('02', 'REF1')) + tlv('53', '764') + tlv('58', 'TH') + (nm ? tlv('59', nm) : '') + '6304';\n  return s + crc16(s);\n}\nfunction taxIdOk(t) {   // หลักตรวจสอบเลขประจำตัวผู้เสียภาษี/เลขนิติบุคคล 13 หลัก\n  let sum = 0; for (let i = 0; i < 12; i++) sum += Number(t[i]) * (13 - i);\n  return (11 - (sum % 11)) % 10 === Number(t[12]);\n}\nfunction billerOf(tpl) { const t = (tlvParse(tpl || '') || []).find(x => x.t === '30'); return t ? ((tlvParse(t.v) || []).find(y => y.t === '01') || {}).v || '' : ''; }\n// Ref1/Ref2 ตามที่ตั้งไว้ (ค่าที่ธนาคารกำหนด หรือแทนค่าอัตโนมัติ) · ว่าง = ใช้ Ref เดิมใน QR ของธนาคาร\nfunction billRefs(it) {\n  const fill = tp => String(tp || '').replace(/\\{house\\}/g, houseRef(it.house_no)).replace(/\\{house_digits\\}/g, String(it.house_no || '').replace(/\\D/g, ''))\n    .replace(/\\{invoice\\}/g, intentRef(it.intent_id)).replace(/\\{yyyymm\\}/g, today().slice(0, 7).replace('-', '')).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 20);\n  return { ref1: fill(setting('BILL_REF1')), ref2: fill(setting('BILL_REF2')), force: true };\n}\n// QR ของใบแจ้ง: ปิด QR → '' · Bill Payment แบบเดิมของ ธปท. → |BillerID↵Ref1↵Ref2↵สตางค์ · อื่นๆ → EMVCo\nfunction intentQr(it) {\n  const tpl = setting('PROMPTPAY_PAYLOAD');\n  if (!tpl || !isTrue(setting('PAY_QR_ENABLED'))) return '';\n  const bill = tpl.indexOf('0016' + BILL_AID) >= 0, refs = bill ? billRefs(it) : null;\n  if (bill && setting('BILL_QR_FORMAT') === 'bot') return ppBot(billerOf(tpl), refs.ref1 || 'REF1', refs.ref2, num(it.total));\n  return ppBuild(tpl, num(it.total), refs);\n}\nfunction ppBot(biller, ref1, ref2, amount) {   // รูปแบบเดิมของ ธปท. (ตามไลบรารีต้นฉบับ generateBOT): ยอดเป็นสตางค์ ปัดลง\n  if (!/^\\d{15}$/.test(biller)) throw new Error('ไม่พบ Biller ID ใน QR ต้นแบบ');\n  return '|' + biller + '\\n' + ref1 + '\\n' + (ref2 || '') + '\\n' + (amount > 0 ? Math.floor(Math.round(amount * 1000) / 10) : 0);\n}\nconst houseRef = h => String(h || '').toUpperCase().replace(/\\//g, 'X').replace(/[^A-Z0-9]/g, '').slice(0, 15);   // 49/48 → 49X48\nconst intentRef = id => String(id || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(-20);\nfunction ppBuild(template, amount, refs) {\n  const tl = tlvParse(template); if (!tl) throw new Error('QR ต้นแบบไม่ถูกต้อง');\n  const body = tl.filter(x => x.t !== '63' && x.t !== '54').map(x => {\n    if (x.t === '01') return { t: '01', v: '12' };\n    if (x.t === '30' && refs) {   // Bill Payment: แทน Ref1/Ref2 ด้วยรหัสบ้านและเลขใบแจ้ง\n      const all = tlvParse(x.v) || [], g = t => (all.find(y => y.t === t) || {}).v;\n      // Ref ที่ตั้งไว้ว่าง = ใช้ Ref เดิมใน QR ของธนาคาร\n      const r1 = refs.ref1 || g('02'), r2 = refs.ref1 ? refs.ref2 : g('03');\n      const sub = all.filter(y => y.t === '00' || y.t === '01');\n      if (r1) sub.push({ t: '02', v: r1 });\n      if (r1 && r2) sub.push({ t: '03', v: r2 });\n      return { t: '30', v: sub.map(y => tlv(y.t, y.v)).join('') };\n    }\n    return x;\n  });\n  if (amount > 0) { let idx = body.findIndex(x => x.t > '54'); if (idx < 0) idx = body.length; body.splice(idx, 0, { t: '54', v: round2(amount).toFixed(2) }); }\n  const s = body.map(x => x.t + ('0' + x.v.length).slice(-2) + x.v).join('') + '6304';\n  return s + crc16(s);\n}\n\n/* ======================= ใบแจ้งชำระ / แพ็กเกจ / สเตตเมนต์ ======================= */\nfunction addDays(dateStr, n) { const x = new Date(dateStr + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }\nconst eomOf = (y, m) => `${y}-${pad2(m)}-${pad2(new Date(Date.UTC(y, m, 0)).getUTCDate())}`;\nfunction monthRange(a, b) {\n  const out = []; let [y, m] = a.split('-').map(Number); const [y2, m2] = b.split('-').map(Number);\n  while (y < y2 || (y === y2 && m <= m2)) { out.push(`${y}-${pad2(m)}`); m++; if (m > 12) { m = 1; y++; } }\n  return out;\n}\nfunction monthEligible(invs, k) {   // เดือนที่เข้าแพ็กเกจได้: ไม่อยู่ในแพ็กเกจ/บิลรอบอื่น และไม่มีการจ่ายรายเดือนไปแล้ว\n  const cov = invs.filter(i => i.cover_from <= k && k <= i.cover_to);\n  if (cov.some(i => i.plan !== 'monthly')) return { ok: false };\n  const mi = cov.find(i => i.plan === 'monthly');\n  if (mi && num(mi.paid) > 0) return { ok: false };\n  return { ok: true, mi };\n}\nfunction packageOptions(houseNo) {\n  const h = findOne('Houses', 'house_no', houseNo); if (!h) return [];\n  const t = today(), y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7)), cm = t.slice(0, 7), unit = round2(num(h.area_sqw) * num(setting('RATE_PER_SQW'))), unitNet = round2(unit * (1 - num(setting('DISCOUNT_MONTH_PCT')) / 100));\n  if (!(unit > 0)) return [];\n  const invs = rows('Invoices').filter(i => eq(i.house_no, houseNo) && i.status !== 'void' && i.cover_from), defs = [];\n  if (m === num(setting('HALF1_DUE_MONTH'))) defs.push({ id: 'H1', plan: 'half', label: `ราย 6 เดือน (ม.ค.–มิ.ย. ${y + 543})`, from: `${y}-01`, to: `${y}-06`, pct: num(setting('DISCOUNT_HALF_PCT')), win: m });\n  if (m === num(setting('HALF2_DUE_MONTH'))) defs.push({ id: 'H2', plan: 'half', label: `ราย 6 เดือน (ก.ค.–ธ.ค. ${y + 543})`, from: `${y}-07`, to: `${y}-12`, pct: num(setting('DISCOUNT_HALF_PCT')), win: m });\n  if (m === num(setting('YEAR_DUE_MONTH'))) defs.push({ id: 'Y', plan: 'yearly', label: `รายปี (ม.ค.–ธ.ค. ${y + 543})`, from: `${y}-01`, to: `${y}-12`, pct: num(setting('DISCOUNT_YEAR_PCT')), win: m });\n  return defs.map(df => {\n    const months = []; let full = 0;\n    monthRange(df.from > cm ? df.from : cm, df.to).forEach(k => { const e = monthEligible(invs, k); if (!e.ok) return; months.push(k); full += e.mi ? (num(e.mi.gross) || num(e.mi.amount)) : unit; });   // ราคาเต็มของพื้นที่บ้าน\n    if (!months.length) return null;\n    full = round2(full); const amount = round2(full * (1 - df.pct / 100)), monthly = round2(full * (1 - num(setting('DISCOUNT_MONTH_PCT')) / 100));\n    return { id: df.id, plan: df.plan, label: df.label, pct: df.pct, months, full, amount, monthly, save: round2(monthly - amount), due: eomOf(y, df.win) };   // แพ็กเกจลด % จากราคาเต็ม ไม่ซ้อนกับส่วนลดรายเดือน\n  }).filter(Boolean);\n}\nfunction makePackageInvoice(houseNo, it) {   // สร้างใบแพ็กเกจจริงตอนยืนยันรับเงิน และยกเลิกบิลรายเดือนที่ยังไม่จ่ายของเดือนที่รวมอยู่ในแพ็กเกจ\n  const h = findOne('Houses', 'house_no', houseNo), unit = round2(num(h.area_sqw) * num(setting('RATE_PER_SQW'))), unitNet = round2(unit * (1 - num(setting('DISCOUNT_MONTH_PCT')) / 100));\n  const invs = rows('Invoices').filter(i => eq(i.house_no, houseNo) && i.status !== 'void' && i.cover_from), months = []; let gross = 0;\n  (it.months || []).forEach(k => {\n    const e = monthEligible(invs, k); if (!e.ok) return;\n    months.push(k); gross += e.mi ? (num(e.mi.gross) || num(e.mi.amount)) : unit;\n    if (e.mi) patch('Invoices', e.mi, { status: 'void', note: 'รวมในแพ็กเกจ ' + it.label });\n  });\n  if (!months.length) return null;\n  gross = round2(gross); const disc = round2(gross * num(it.pct) / 100), id = uid('INV');\n  insert('Invoices', { invoice_id: id, house_no: houseNo, period: `${months[0].slice(0, 4)}-${it.pkg}`, plan: it.plan, cover_from: months[0], cover_to: months[months.length - 1], months: months.length,\n    area_sqw: h.area_sqw, rate: num(setting('RATE_PER_SQW')), gross, discount_pct: num(it.pct), discount: disc, adjust: 0, amount: round2(gross - disc), paid: 0, due_date: it.due,\n    status: 'unpaid', created_at: now(), note: 'แพ็กเกจ ' + it.label, discount_lost: 'FALSE' });\n  return findOne('Invoices', 'invoice_id', id);\n}\nfunction payInvoice(inv, take) { const paid = round2(num(inv.paid) + take); patch('Invoices', inv, { paid, status: paid >= num(inv.amount) ? 'paid' : 'partial' }); }\nfunction allocateIntent(p, intent, amount, payDate) {   // ตัดตามรายการที่ลูกบ้านเลือกเป๊ะ ส่วนที่ตัดไม่ได้ตัดตามลำดับปกติ\n  let left = round2(amount); const alloc = [];\n  JSON.parse(intent.items_json || '[]').forEach(it => {\n    if (it.type === 'invoice') {\n      const inv = findOne('Invoices', 'invoice_id', it.invoice_id);\n      if (!inv || !OPEN.includes(inv.status)) return;\n      const take = Math.min(round2(it.amount), outstanding(inv), left);\n      if (take > 0) { payInvoice(inv, take); alloc.push({ invoice_id: inv.invoice_id, period: inv.period, amount: take }); left = round2(left - take); }\n    } else if (it.type === 'package') {\n      if (payDate > it.due) return;   // โอนเลยช่วงแพ็กเกจ: ไม่ได้ส่วนลด ตัดเป็นรายเดือนตามลำดับปกติ\n      const inv = makePackageInvoice(p.house_no, it); if (!inv) return;\n      const take = Math.min(num(inv.amount), left);\n      payInvoice(inv, take); alloc.push({ invoice_id: inv.invoice_id, period: `${inv.period} ${it.label}`, amount: take }); left = round2(left - take);\n    }\n  });\n  const rest = allocate(p.house_no, left, payDate);\n  return { alloc: alloc.concat(rest.alloc), left: rest.left };\n}\nfunction intentView(it) {\n  const tpl = setting('PROMPTPAY_PAYLOAD'), bill = !!tpl && tpl.indexOf('0016' + BILL_AID) >= 0, refs = bill ? billRefs(it) : { ref1: '', ref2: '' };\n  return { intent_id: it.intent_id, house_no: it.house_no, total: num(it.total), items: JSON.parse(it.items_json || '[]'), status: it.status, created_at: it.created_at,\n    expires_at: it.expires_at, pay_id: it.pay_id, qr_payload: it.status === 'awaiting' ? intentQr(it) : '', bill, ref1: refs.ref1, ref2: refs.ref2 };\n}\nfunction expireIntents() { const t = today(); rows('Intents').filter(i => i.status === 'awaiting' && i.expires_at < t).forEach(i => patch('Intents', i, { status: 'expired' })); }\nfunction bankFind(amount, paidOn, payId) {\n  const a = addDays(paidOn, -1), b = addDays(paidOn, 1), L = rows('BankLines');\n  const ok = x => Math.abs(num(x.amount) - amount) < 0.005 && x.date >= a && x.date <= b;\n  return (payId && L.find(x => x.matched_pay === payId && ok(x))) || L.find(x => !x.matched_pay && ok(x)) || null;\n}\nfunction splitCsv(line, sep) { const out = []; let cur = '', q = false; for (const ch of line) { if (ch === '\"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(x => x.trim()); }\nfunction normDate(s) {\n  s = String(s).trim(); let y, mo, d, m = s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/);\n  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }\n  else { m = s.match(/^(\\d{1,2})[\\/\\-.](\\d{1,2})[\\/\\-.](\\d{2,4})/); if (!m) return ''; d = +m[1]; mo = +m[2]; y = +m[3]; if (y < 100) y += 2000; }\n  if (y > 2400) y -= 543;\n  return (mo < 1 || mo > 12 || d < 1 || d > 31) ? '' : `${y}-${pad2(mo)}-${pad2(d)}`;\n}\nfunction parseBankCsv(text) {   // รองรับไฟล์จากธนาคาร (ตรวจหัวตารางเอง) หรือรูปแบบ วันที่,เวลา,จำนวนเงิน,รายละเอียด\n  text = String(text || '').replace(/^﻿/, '');\n  const lines = text.split(/\\r?\\n/).map(x => x.trim()).filter(Boolean).slice(0, 5000);\n  const sep = lines.some(l => l.includes('\\t')) ? '\\t' : (lines.filter(l => l.includes(';')).length > lines.length / 2 ? ';' : ','), out = []; let col = null;\n  const pn = v => parseFloat(String(v || '').replace(/[,\\s฿]/g, '')) || 0;\n  lines.forEach(line => {\n    const c = splitCsv(line, sep);\n    if (!col && c.some(x => /วันที่|date/i.test(x)) && c.some(x => /ฝาก|เงินเข้า|เครดิต|credit|deposit|จำนวน|amount|รับ/i.test(x))) {\n      const ix = (re, from) => c.findIndex((x, i) => (from === undefined || i !== from) && re.test(x));\n      col = { date: ix(/วันที่|date/i), time: ix(/เวลา|time/i), cr: ix(/ฝาก|เงินเข้า|เครดิต|credit|deposit/i), amt: ix(/จำนวน|amount/i), type: ix(/ประเภท|type|dr\\/cr|d\\/c/i),\n        desc: ix(/รายละเอียด|desc|detail|ช่องทาง|channel/i), ref: ix(/reference|ref\\b|เลขที่อ้างอิง|อ้างอิง|หมายเหตุ|memo|note/i), name: ix(/ผู้โอน|ชื่อ|name|from|sender/i) };\n      return;\n    }\n    const di = col ? col.date : c.findIndex(x => normDate(x)), date = di >= 0 ? normDate
