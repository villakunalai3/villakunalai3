<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>คุณาลัย 3</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1d2733;--mut:#6b7785;--pri:#0a7d5a;--red:#c62828;--amb:#b26a00;--bd:#e1e6eb}
@media(prefers-color-scheme:dark){:root{--bg:#12161a;--card:#1b2127;--tx:#e8edf2;--mut:#93a0ad;--pri:#3ecf9d;--red:#ff7b72;--amb:#f0b35a;--bd:#2c353e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Sarabun",sans-serif;padding-bottom:70px}
header{background:var(--pri);color:#fff;padding:12px 16px;font-weight:600}
main{padding:12px 16px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:0 0 12px}
h3{margin:0 0 8px;font-size:16px}.mut{color:var(--mut);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;overflow-x:auto}
nav button{flex:1 0 auto;border:0;background:none;color:var(--mut);padding:10px 12px;font:inherit;font-size:13px;white-space:nowrap}
nav button.on{color:var(--pri);font-weight:700}
input,select,textarea{width:100%;padding:9px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button.b{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;margin:2px 4px 2px 0}
button.b.g{background:var(--mut)}button.b.r{background:var(--red)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.paid{color:var(--pri)}.open,.partial{color:var(--amb)}.overdue{color:var(--red);font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.grid b{font-size:22px;display:block}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px}.bars div{flex:1;display:flex;gap:1px;align-items:flex-end;height:100%}.bars i{flex:1;background:var(--pri);min-height:1px}.bars i.e{background:var(--red)}
img.ph{max-width:100%;border-radius:8px;margin-top:4px}
#toast{position:fixed;top:56px;left:16px;right:16px;max-width:728px;margin:auto;background:#222;color:#fff;padding:10px;border-radius:8px;display:none;z-index:9}
</style></head><body>
<header id="hd">คุณาลัย 3</header><main id="v">กำลังโหลด…</main><nav id="nav"></nav><div id="toast"></div>
<script>
const LIFF_ID='PUT_LIFF_ID_HERE', API_URL='PUT_APPS_SCRIPT_WEBAPP_URL_HERE';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const ST={paid:'ชำระแล้ว',open:'รอชำระ',partial:'จ่ายบางส่วน',overdue:'ค้างจ่าย'};
const stag=s=>`<span class="tag ${s}">${ST[s]||s}</span>`;
let ME=null, tab='home';
function toast(m,err){const t=$('#toast');t.textContent=m;t.style.background=err?'#b3261e':'#222';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
async function api(action,data){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:liff.getIDToken(),action,data:data||{}})});
  const j=await r.json();
  if(!j.ok){ if(/หมดอายุ|expired/i.test(j.error)){liff.logout();liff.login();} throw new Error(j.error); }
  return j.data;
}
async function run(fn){try{await fn()}catch(e){toast(e.message,1)}}
function pick(id){return new Promise(res=>{const f=$('#'+id)?.files?.[0];if(!f)return res(null);const im=new Image,u=URL.createObjectURL(f);
  im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7).split(',')[1])};im.src=u})}
const val=id=>$('#'+id)?.value??'';
async function openFile(id){await run(async()=>{const f=await api('getFile',{id});const b=new Blob([Uint8Array.from(atob(f.b64),c=>c.charCodeAt(0))],{type:f.mime});window.open(URL.createObjectURL(b),'_blank')})}

const ROLE_TABS={
 resident:[['home','ภาพรวม'],['acc','บัญชีบ้าน'],['rep','แจ้งซ่อม'],['cmp','ร้องเรียน']],
 committee:[['home','ภาพรวม'],['pay','สลิป'],['adj','ปรับยอด'],['exp','เบิกจ่าย'],['houses','บ้าน'],['cmps','ร้องเรียน'],['rep','แจ้งซ่อม']],
 manager:[['home','ภาพรวม'],['pay','สลิป'],['houses','บ้าน'],['adj','ปรับยอด'],['exp','เบิกจ่าย'],['rec','ประจำ'],['cmps','ร้องเรียน'],['rep','แจ้งซ่อม'],['ann','ประกาศ'],['usr','ผู้ใช้'],['par','พัสดุ']],
 guard:[['par','ฝากพัสดุ'],['home','ภาพรวม']]
};
async function init(){
  await liff.init({liffId:LIFF_ID}); if(!liff.isLoggedIn()){liff.login();return}
  await run(async()=>{ME=await api('me'); $('#hd').textContent=ME.village+' • '+ME.name;
    if(ME.role==='none')return reg(); if(!ME.active){$('#v').innerHTML='<div class="card">ลงทะเบียนแล้ว รอนิติบุคคลยืนยันบัญชี</div>';return}
    tab=ROLE_TABS[ME.role][0][0]; go(tab)});
}
function go(t){tab=t;$('#nav').innerHTML=ROLE_TABS[ME.role].map(([k,n])=>`<button class="${k===t?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
  run(()=>VIEWS[t]())}
function show(h){$('#v').innerHTML=h}
function reg(){show(`<div class="card"><h3>ลงทะเบียนลูกบ้าน</h3><input id="rn" placeholder="ชื่อ-นามสกุล"><input id="rp" placeholder="เบอร์โทร" inputmode="tel"><input id="rh" placeholder="บ้านเลขที่"><p class="mut">ข้อมูลใช้เพื่อการบริหารหมู่บ้านเท่านั้น และเข้าถึงได้เฉพาะนิติบุคคลและกรรมการ (PDPA)</p><button class="b" onclick="run(async()=>{await api('register',{name:val('rn'),phone:val('rp'),house_no:val('rh')});toast('ส่งคำขอแล้ว รอการยืนยัน');init()})">ลงทะเบียน</button></div>`)}

function invHtml(i,staff){return `<div class="row"><div><b>${esc(i.period_label)}</b><div class="mut">ครบกำหนด ${i.due_date}${i.discount_amount>0?' • ส่วนลด '+fmt(i.discount_amount)+(i.discount_lost?' (หมดสิทธิ์)':' ถ้าจ่ายครบภายในกำหนด'):''}${i.adjust?' • ปรับยอด '+fmt(i.adjust):''}</div><div class="mut">ยอด ${fmt(i.target)} • จ่ายแล้ว ${fmt(i.paid)}</div>${staff&&i.status!=='paid'?`<button class="b g" onclick="adjForm('${i.id}')">ปรับยอด</button>`:''}</div><div style="text-align:right">${stag(i.status)}<div><b>${i.outstanding>0?fmt(i.outstanding):''}</b></div></div></div>`}
function payRows(a){return a.payments.map(p=>`<div class="row"><div>${p.pay_date} • ${fmt(p.amount)}<div class="mut">${p.status==='confirmed'?'ใบเสร็จ '+p.receipt_no:p.status==='pending'?'รอตรวจสอบ':'ไม่ผ่าน: '+esc(p.note)}</div></div><div>${p.receipt_file&&ME.role!=='guard'?`<button class="b g" onclick="openFile('${p.receipt_file}')">ใบเสร็จ</button>`:''}${p.slip_file&&ME.role==='manager'||ME.role==='committee'?`<button class="b g" onclick="openFile('${p.slip_file}')">สลิป</button>`:''}</div></div>`).join('')||'<div class="mut">ยังไม่มีรายการ</div>'}
function adjHtml(a){return a.adjustments.length?`<div class="card"><h3>การปรับยอด</h3>${a.adjustments.map(x=>`<div class="row"><div>${x.kind==='decrease'?'ลด':'เพิ่ม'} ${fmt(x.amount)} • ${esc(x.reason)}</div><div class="mut">${{pending:'รออนุมัติ',approved:'อนุมัติ',rejected:'ไม่อนุมัติ'}[x.status]}</div></div>`).join('')}</div>`:''}

const VIEWS={
async home(){const d=await api('dashboard');const c=d.collection,mx=Math.max(1,...d.chart.flatMap(x=>[x.income,x.expense]));
 show(`${d.announcements.map(a=>`<div class="card"><b>📢 ${esc(a.title)}</b><div>${esc(a.body)}</div><div class="mut">${a.created_at}</div></div>`).join('')}
 <div class="card"><h3>สถานะค่าส่วนกลาง (${d.houses} หลัง)</h3><div class="grid"><div class="paid"><b>${c.paid}</b>ชำระแล้ว</div><div class="open"><b>${c.open}</b>รอชำระ</div><div class="overdue"><b>${c.overdue}</b>ค้างจ่าย</div></div></div>
 <div class="card"><h3>เงินคงเหลือ ${fmt(d.balance)} บาท</h3><div class="bars">${d.chart.map(x=>`<div title="${x.m}"><i style="height:${x.income/mx*100}%"></i><i class="e" style="height:${x.expense/mx*100}%"></i></div>`).join('')}</div><div class="mut">เขียว = รายรับ • แดง = รายจ่าย (12 เดือนล่าสุด)</div></div>
 ${d.committeeCount!==undefined&&d.committeeCount<d.needApprovals?`<div class="card overdue">⚠ มีกรรมการในระบบ ${d.committeeCount} คน แต่ต้องอนุมัติ ${d.needApprovals} คน</div>`:''}
 <div class="card"><h3>งานซ่อมส่วนกลาง</h3>${d.repairs.map(r=>`<div class="row"><div>${esc(r.title)}<div class="mut">${esc(r.location)} • ${r.created_at.slice(0,10)}</div></div><span class="tag ${r.status==='เสร็จสิ้น'?'paid':'open'}">${r.status}</span></div>`).join('')||'<div class="mut">ไม่มี</div>'}</div>
 ${d.complaints.length?`<div class="card"><h3>เรื่องร้องเรียนที่เผยแพร่</h3>${d.complaints.map(r=>`<div class="row"><div>${esc(r.subject)}<div class="mut">${esc(r.response)}</div></div><span class="tag">${esc(r.status)}</span></div>`).join('')}</div>`:''}
 <div class="card"><h3>รายจ่ายล่าสุด</h3>${d.expenses.map(e=>`<div class="row"><div>${esc(e.description)}<div class="mut">${e.paid_at.slice(0,10)}${e.kind==='petty'?' • เงินสดย่อย':''}</div></div><b>${fmt(e.amount)}</b></div>`).join('')||'<div class="mut">ไม่มี</div>'}</div>`)},

async acc(){const a=await api('myAccount');
 show(`<div class="card"><h3>บ้าน ${esc(a.house.house_no)} • ${a.house.area_sqw} ตร.ว.</h3><div>ค้างชำระ <b>${fmt(a.outstanding)}</b> บาท${a.overdue>0?` <span class="overdue">(ค้างจ่าย ${fmt(a.overdue)})</span>`:''}</div><div>เครดิต ${fmt(a.credit)} บาท</div><div class="mut">โอนเข้า: ${esc(a.bank)}</div></div>
 <div class="card"><h3>บิล</h3>${a.invoices.map(i=>invHtml(i,false)).join('')||'<div class="mut">ยังไม่มีบิล</div>'}</div>
 <div class="card"><h3>แจ้งโอนเงิน</h3><input id="pa" type="number" inputmode="decimal" placeholder="จำนวนเงิน"><input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="pf" type="file" accept="image/*"><button class="b" onclick="run(async()=>{await api('submitPayment',{amount:val('pa'),pay_date:val('pd'),file:await pick('pf'),mime:'image/jpeg'});toast('ส่งสลิปแล้ว');go('acc')})">ส่งสลิป</button><div class="mut">ระบบตัดงวดปัจจุบันก่อน แล้วจึงตัดยอดค้างย้อนหลัง ส่วนที่เกินเก็บเป็นเครดิต</div></div>
 ${adjHtml(a)}<div class="card"><h3>การชำระเงิน</h3>${payRows(a)}</div>`)},

async houses(){const h=await api('houses');
 show(`<div class="card"><h3>บ้านทั้งหมด</h3>${h.map(x=>`<div class="row" onclick="houseDetail('${esc(x.house_no)}')" style="cursor:pointer"><div><b>${esc(x.house_no)}</b> ${esc(x.owner_name)}<div class="mut">${x.plan} • ${x.area_sqw} ตร.ว.${x.credit?' • เครดิต '+fmt(x.credit):''}</div></div><div style="text-align:right">${stag(x.status)}<div>${x.outstanding?fmt(x.outstanding):''}</div></div></div>`).join('')}</div>`)},

async pay(){const p=await api('pendingPayments');
 show(`<div class="card"><h3>สลิปรอตรวจสอบ</h3>${p.map(x=>`<div class="row"><div><b>บ้าน ${esc(x.house_no)}</b> ${x.pay_date}<div class="mut">${esc(x.submitted_by)}</div><input id="am${x.id}" type="number" value="${x.amount}" style="width:120px"><button class="b g" onclick="openFile('${x.slip_file}')">ดูสลิป</button></div><div><button class="b" onclick="run(async()=>{await api('confirmPayment',{id:'${x.id}',amount:val('am${x.id}')});toast('ยืนยันแล้ว');go('pay')})">ยืนยัน</button><button class="b r" onclick="rej('${x.id}')">ไม่ผ่าน</button></div></div>`).join('')||'<div class="mut">ไม่มีรายการ</div>'}</div>`)},

async adj(){const l=await api('pendingAdjust');
 show(`<div class="card"><h3>ปรับยอดรออนุมัติ</h3>${l.map(a=>`<div class="row"><div><b>บ้าน ${esc(a.house_no)}</b> ${a.kind==='decrease'?'ลดยอด':'เพิ่มยอด'} ${fmt(a.amount)}<div class="mut">${esc(a.reason)} • โดย ${esc(a.requested_by)}</div><div class="mut">อนุมัติแล้ว ${a.votes.filter(v=>v.vote==='approve').length} คน</div></div>${ME.role==='committee'?`<div><button class="b" onclick="vAdj('${a.id}','approve')">อนุมัติ</button><button class="b r" onclick="vAdj('${a.id}','reject')">ไม่อนุมัติ</button></div>`:''}</div>`).join('')||'<div class="mut">ไม่มีรายการ</div>'}</div>`)},

async exp(){const l=await api('listExpenses',{});const pend=l.filter(e=>e.status==='pending'),appr=l.filter(e=>e.status==='approved'),done=l.filter(e=>['paid','rejected'].includes(e.status)).slice(0,15);
 const row=(e,btn)=>`<div class="row"><div><b>${esc(e.description)}</b><div class="mut">${fmt(e.amount)} • ${esc(e.category)} ${esc(e.vendor)} • ${e.kind==='petty'?'เงินสดย่อย':e.kind==='recurring'?'ประจำ':'ทั่วไป'}</div><div class="mut">อนุมัติแล้ว ${e.votes.filter(v=>v.vote==='approve').length} คน • ผู้ขอ ${esc(e.requested_by)}</div>${e.bill_file?`<button class="b g" onclick="openFile('${e.bill_file}')">บิล</button>`:''}</div><div>${btn||''}</div></div>`;
 show(`${ME.role==='manager'?`<div class="card"><h3>ขอเบิกจ่าย</h3><input id="ed" placeholder="รายละเอียด เช่น น้ำมันเครื่องตัดหญ้า"><input id="ec" placeholder="หมวด"><input id="ev" placeholder="ผู้รับเงิน/ร้านค้า"><input id="ea" type="number" placeholder="จำนวนเงิน"><input id="ef" type="file" accept="image/*"><div class="mut">ไม่เกินวงเงินเงินสดย่อยจ่ายได้ทันที (ต้องแนบบิล) กรรมการจะได้รับแจ้ง</div><button class="b" onclick="run(async()=>{const r=await api('requestExpense',{description:val('ed'),category:val('ec'),vendor:val('ev'),amount:val('ea'),bill:await pick('ef'),mime:'image/jpeg'});toast(r.petty?'บันทึกเงินสดย่อยแล้ว':'ส่งขออนุมัติแล้ว '+r.note);go('exp')})">ส่ง</button></div>`:''}
 <div class="card"><h3>รออนุมัติ (${pend.length})</h3>${ME.role==='committee'&&pend.some(e=>e.kind==='recurring')?`<button class="b" onclick="run(async()=>{const n=await api('approveAllRecurring');toast('อนุมัติ '+n+' รายการ');go('exp')})">อนุมัติรายการประจำทั้งหมด</button>`:''}${pend.map(e=>row(e,ME.role==='committee'?`<button class="b" onclick="vExp('${e.id}','approve')">อนุมัติ</button><button class="b r" onclick="vExp('${e.id}','reject')">ไม่</button>`:'')).join('')||'<div class="mut">ไม่มี</div>'}</div>
 <div class="card"><h3>อนุมัติแล้ว รอจ่าย (${appr.length})</h3>${appr.map(e=>row(e,ME.role==='manager'?`<input id="ps${e.id}" type="file" accept="image/*"><button class="b" onclick="payExp('${e.id}',${!e.bill_file})">จ่ายแล้ว</button>`:'')).join('')||'<div class="mut">ไม่มี</div>'}</div>
 <div class="card"><h3>ล่าสุด</h3>${done.map(e=>row(e,`<span class="tag ${e.status==='paid'?'paid':'overdue'}">${e.status==='paid'?'จ่ายแล้ว':'ไม่อนุมัติ'}</span>`)).join('')}</div>`)},

async rec(){const l=await api('listRecurring');
 show(`<div class="card"><h3>ค่าใช้จ่ายประจำ (สร้างรายการขอเบิกอัตโนมัติ)</h3>${l.map(r=>`<div class="row"><div><b>${esc(r.name)}</b> ${fmt(r.amount)}<div class="mut">ล่วงหน้า ${r.months_ahead} เดือน • ${r.active==='TRUE'?'ใช้งาน':'ปิด'}</div></div><button class="b g" onclick="api('saveRecurring',{...${esc(JSON.stringify(r)).replace(/&quot;/g,'&quot;')},active:${r.active!=='TRUE'}}).then(()=>go('rec'))">${r.active==='TRUE'?'ปิด':'เปิด'}</button></div>`).join('')}</div>
 <div class="card"><h3>เพิ่มรายการประจำ</h3><input id="rn" placeholder="ชื่อ เช่น ค่า รปภ."><input id="rc" placeholder="หมวด"><input id="rv" placeholder="ผู้รับเงิน"><input id="ra" type="number" placeholder="จำนวนเงิน/เดือน"><select id="rm"><option value="1">สร้างล่วงหน้า 1 เดือน</option><option value="3">สร้างล่วงหน้า 3 เดือน</option><option value="6">6 เดือน</option><option value="12">12 เดือน</option></select><button class="b" onclick="run(async()=>{await api('saveRecurring',{name:val('rn'),category:val('rc'),vendor:val('rv'),amount:val('ra'),months_ahead:val('rm')});go('rec')})">บันทึก</button></div>`)},

async rep(){const d=await api('dashboard');const staff=ME.role==='manager'||ME.role==='committee';
 show(`<div class="card"><h3>แจ้งซ่อมส่วนกลาง</h3><input id="rt" placeholder="เรื่อง เช่น ไฟถนนดับ"><input id="rl" placeholder="ตำแหน่ง เช่น ซอย 3 หน้าบ้าน 25"><textarea id="rd" placeholder="รายละเอียด"></textarea><input id="rf" type="file" accept="image/*"><button class="b" onclick="run(async()=>{await api('createRepair',{title:val('rt'),location:val('rl'),detail:val('rd'),photo:await pick('rf'),mime:'image/jpeg'});toast('แจ้งแล้ว');go('rep')})">ส่งเรื่อง</button></div>
 <div class="card">${d.repairs.map(r=>`<div class="row"><div><b>${esc(r.title)}</b><div class="mut">${esc(r.location)} ${r.created_at.slice(0,10)}</div>${r.note?`<div>${esc(r.note)}</div>`:''}${r.photo?`<img class="ph" loading="lazy" src="${r.photo}">`:''}${staff?`<div><select id="rs${r.id}"><option>รอดำเนินการ</option><option>กำลังดำเนินการ</option><option>เสร็จสิ้น</option></select><input id="rn${r.id}" placeholder="หมายเหตุ"><button class="b" onclick="run(async()=>{await api('updateRepair',{id:'${r.id}',status:val('rs${r.id}'),note:val('rn${r.id}')});go('rep')})">อัปเดต</button></div>`:''}</div><span class="tag ${r.status==='เสร็จสิ้น'?'paid':'open'}">${r.status}</span></div>`).join('')}</div>`)},

async cmp(){show(`<div class="card"><h3>ร้องเรียน (ส่วนตัว)</h3><div class="mut">เห็นเฉพาะนิติบุคคลและกรรมการ จะไม่แสดงบนหน้าสาธารณะ เว้นแต่นิติฯ พิจารณาเผยแพร่โดยซ่อนบ้านเลขที่</div><input id="cs" placeholder="เรื่อง"><textarea id="cd" rows="4" placeholder="รายละเอียด"></textarea><button class="b" onclick="run(async()=>{await api('createComplaint',{subject:val('cs'),detail:val('cd')});toast('ส่งเรื่องแล้ว');go('cmp')})">ส่ง</button></div>`)},

async cmps(){const l=await api('listComplaints');
 show(`<div class="card"><h3>เรื่องร้องเรียน</h3>${l.map(c=>`<div class="row"><div><b>${esc(c.subject)}</b> <span class="mut">บ้าน ${esc(c.house_no)} ${c.created_at.slice(0,10)}</span><div>${esc(c.detail)}</div>${c.published==='TRUE'?'<div class="tag paid">เผยแพร่แล้ว</div>':''}${ME.role==='manager'?`<textarea id="cr${c.id}" placeholder="คำตอบ/ผลดำเนินการ">${esc(c.response)}</textarea><select id="cst${c.id}"><option value="reviewing">กำลังพิจารณา</option><option value="resolved">แก้ไขแล้ว</option></select><label><input type="checkbox" id="cp${c.id}" style="width:auto" ${c.published==='TRUE'?'checked':''}> เผยแพร่บน Dashboard (ซ่อนบ้านเลขที่)</label><br><button class="b" onclick="run(async()=>{await api('updateComplaint',{id:'${c.id}',status:val('cst${c.id}'),response:val('cr${c.id}'),publish:$('#cp${c.id}').checked});go('cmps')})">บันทึก</button>`:''}</div></div>`).join('')||'<div class="mut">ไม่มี</div>'}</div>`)},

async par(){const l=await api('recentParcels');
 show(`<div class="card"><h3>ฝากพัสดุที่ป้อมยาม</h3><input id="pn" placeholder="บ้านเลขที่"><input id="pt" placeholder="หมายเหตุ (ถ้ามี)"><input id="pp" type="file" accept="image/*" capture="environment"><button class="b" onclick="run(async()=>{await api('addParcel',{house_no:val('pn'),note:val('pt'),photo:await pick('pp'),mime:'image/jpeg'});toast('ส่งแจ้งลูกบ้านแล้ว');go('par')})">ถ่ายรูปและแจ้งลูกบ้าน</button></div><div class="card"><h3>ล่าสุด</h3>${l.map(p=>`<div class="row"><div>บ้าน ${esc(p.house_no)} <span class="mut">${p.created_at}</span></div></div>`).join('')}</div>`)},

async ann(){show(`<div class="card"><h3>ส่งประกาศถึงทุกบ้าน</h3><div class="mut">1 ประกาศ = 1 ข้อความต่อลูกบ้านที่ยืนยันแล้ว (นับโควตา LINE) ควรรวมหลายเรื่องไว้ในข้อความเดียว</div><input id="at" placeholder="หัวข้อ"><textarea id="ab" rows="4" placeholder="รายละเอียด"></textarea><button class="b" onclick="run(async()=>{if(!confirm('ส่งประกาศถึงทุกบ้าน?'))return;await api('announce',{title:val('at'),body:val('ab')});toast('ส่งแล้ว');go('home')})">ส่ง</button></div>`)},

async usr(){const l=await api('listUsers');
 show(`<div class="card"><h3>ผู้ใช้งาน</h3>${l.map(u=>`<div class="row"><div><b>${esc(u.name)}</b> บ้าน ${esc(u.house_no)}<div class="mut">${esc(u.phone)}</div><select id="ur${u.line_user_id}">${['resident','committee','manager','guard'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select><label><input type="checkbox" id="ua${u.line_user_id}" style="width:auto" ${u.active==='TRUE'?'checked':''}> ใช้งานได้</label> <button class="b" onclick="run(async()=>{await api('setUser',{line_user_id:'${u.line_user_id}',role:val('ur${u.line_user_id}'),active:$('#ua${u.line_user_id}').checked,house_no:'${esc(u.house_no)}'});toast('บันทึกแล้ว')})">บันทึก</button></div></div>`).join('')}</div>`)}
};

async function houseDetail(no){await run(async()=>{const a=await api('houseAccount',{house_no:no});
 show(`<button class="b g" onclick="go('houses')">← กลับ</button><div class="card"><h3>บ้าน ${esc(no)} ${esc(a.house.owner_name)}</h3>ค้างชำระ <b>${fmt(a.outstanding)}</b> • ค้างจ่าย ${fmt(a.overdue)} • เครดิต ${fmt(a.credit)}</div>
 <div class="card"><h3>บิล</h3>${a.invoices.map(i=>invHtml(i,ME.role==='manager')).join('')}</div>
 <div class="card"><h3>บันทึกรับเงิน (นิติฯ รับเอง)</h3><input id="sa" type="number" placeholder="จำนวนเงิน"><input id="sd" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="sf" type="file" accept="image/*"><button class="b" onclick="run(async()=>{await api('staffPayment',{house_no:'${esc(no)}',amount:val('sa'),pay_date:val('sd'),file:await pick('sf'),mime:'image/jpeg'});toast('บันทึกแล้ว');houseDetail('${esc(no)}')})">บันทึกและออกใบเสร็จ</button></div>
 ${ME.role==='manager'?`<div class="card"><h3>ออกบิลเอง / ยอดค้างยกมา</h3><select id="ik"><option value="carry">ยอดค้างยกมา</option><option value="manual">บิลพิเศษ</option></select><input id="ia" type="number" placeholder="จำนวนเงิน"><input id="idd" type="date"><div class="mut">ใส่วันครบกำหนดที่ผ่านมาแล้ว = นับเป็นค้างจ่าย</div><input id="ir" placeholder="เหตุผล/รายละเอียด"><button class="b" onclick="run(async()=>{await api('createInvoice',{house_no:'${esc(no)}',type:val('ik'),amount:val('ia'),due_date:val('idd'),reason:val('ir')});houseDetail('${esc(no)}')})">ออกบิล</button></div>`:''}
 ${adjHtml(a)}<div class="card"><h3>การชำระเงิน</h3>${payRows(a)}</div>`)})}
function adjForm(id){const k=prompt('ประเภท: พิมพ์ "ลด" หรือ "เพิ่ม"');if(!k)return;const amt=prompt('จำนวนเงิน');const why=prompt('เหตุผล (จำเป็น)');if(!amt||!why)return;
 run(async()=>{await api('requestAdjust',{invoice_id:id,kind:k.trim()==='เพิ่ม'?'increase':'decrease',amount:amt,reason:why});toast('ส่งให้กรรมการอนุมัติแล้ว (ยังไม่มีผลจนกว่าจะอนุมัติครบ)')})}
function vAdj(id,v){run(async()=>{const s=await api('voteAdjust',{id,vote:v});toast('สถานะ: '+s);go('adj')})}
function vExp(id,v){run(async()=>{const s=await api('voteExpense',{id,vote:v});toast('สถานะ: '+s);go('exp')})}
function rej(id){const r=prompt('เหตุผลที่ไม่ผ่าน');if(r===null)return;run(async()=>{await api('rejectPayment',{id,reason:r});go('pay')})}
function payExp(id,needBill){run(async()=>{const slip=await pick('ps'+id);let bill=null;
 await api('payExpense',{id,slip,slipMime:'image/jpeg',bill,mime:'image/jpeg'});toast('บันทึกการจ่ายแล้ว');go('exp')})}
init();
</script></body></html>
